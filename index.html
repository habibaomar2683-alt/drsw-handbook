s it cost?** \"It's £600 in total. You secure your place with £250, which comes off the £600, so it's £350 on the day.\"\n\n**Is the deposit refundable?** \"Refund requests go through an eligibility review. Once a request is approved, the refund can take up to 28 working days to process.\" Don't raise refunds unless asked.\n\n**Can I pay monthly?** \"For this treatment it's simply £250 to secure your place and £350 on the day.\"\n\n**Can I have the consultation and treatment on the same day?** \"Yes, you can, so it's just one visit.\"", "h": "FAQs"}, {"body": "- \"Unfortunately…\" or \"I'm afraid…\"\n- \"Consultation fee\" or \"extra charge\" for the £250. Say \"secure\", \"hold\" or \"reserve\".\n- \"Guaranteed\", \"permanent\", \"risk-free\", \"no swelling\", \"no bruising\".\n- \"It will make your nose smaller\" or any promised result.\n- Anything that diagnoses, or tells a patient they are or aren't suitable.\n- Other treatments or options before the doctor has reviewed the photos.\n- Finance or instalments for this treatment.\n- Anything negative about another clinic.", "h": "Never say"}], "title": "Non-Surgical Rhinoplasty", "updatedAt": 1793213830253, "updatedBy": null}}, {"id": "penis-enlargement-filler", "data": {"kind": "treatment", "order": 40, "sections": [{"body": "- **Treatment:** non-surgical penis enlargement with dermal filler. An aesthetic treatment that increases the size of the penis only. It doesn't treat erectile dysfunction or other medical conditions. Glans filler is a different treatment and isn't covered on this page.\n- **Product:** hyaluronic acid (HA) filler, a temporary filler. HA already exists naturally in the body; the body's collagen \"swims\" in it. The doctor may instead recommend a **bio-stimulator** (Ellansé or Radiesse), which stimulates the body's own collagen. The doctor explains the options at the consultation.\n- **How it works:** the filler is injected through a single entry point with a cannula and spread evenly along the shaft.\n- **What patients notice:** more girth, a little more length when relaxed, and less \"shrinkage\". On average (from our website): about 10–15% more girth, flaccid and erect, and 5–10% more flaccid length; up to 30–40% more girth with more filler. Results vary from person to person.\n- **Anaesthesia:** **numbing cream**. No general anaesthetic.\n- **Time:** 15 to 20 minutes maximum.\n- **Sessions:** usually one treatment.\n- **Results:** about 15 to 18 months, as the HA is slowly absorbed. Top-ups usually need less filler.\n- **After:** possible minor bruising, tenderness, redness and swelling. Swelling settles in 24 to 48 hours.\n- **Back to work:** immediately. No strenuous exercise or heavy lifting for one week. No sexual activity for 2 to 3 weeks.\n- **Standards:** premium products, all tools sterilised, trained and highly skilled doctors, five-star service.\n- **Suits:** most men. The doctor takes a full medical history and confirms suitability at the consultation.\n- **Price:** **£250 per ml**, or a package. **Pitch 10ml for £1,500 only.** The final price depends on the ml the doctor recommends at the consultation. Packages are permanent prices, not offers.\n- **Deposit:** £250 secures the consultation and is redeemed against the treatment.\n- **Finance:** 0% over 3, 6, 9 or 12 months (the treatment is £1,000 or more). Don't offer it; only mention it if the patient asks to pay in instalments. 10ml package: £1,250 balance after the deposit = £416.67 / £208.33 / £138.89 / £104.17 a month over 3 / 6 / 9 / 12 months.\n- **Entry step:** **no photos and no photo assessment.** Take the £250 deposit and book the consultation on the call. The info email is optional: send it only if the patient asks for it. Consultation and treatment can be on the same day.\n\n### Packages (team visibility only)\nPitch the 10ml package. Use the others only if the patient asks about more than 10ml or the doctor recommends more.\n\n| Package | Price |\n|---|---|\n| 10ml (pitch this one) | **£1,500** |\n| 15ml | £2,250 |\n| 20ml | £3,000 |\n| 24ml | £3,500 |\n| Without a package | £250 per ml |\n\n### Not one treatment fits all\nEvery treatment is designed around the patient's needs. That is why the patient has a consultation with the doctor before anything goes ahead.", "h": "At a glance"}, {"body": "- **Always pitch the treatment**, even if the patient says they don't need any info.\n- **Explain first, screen second.**\n- **Be confident.** No \"unfortunately\", no \"I'm afraid\".\n- **One path, no options.** Deposit, booking, consultation with the doctor. Send the info email only if the patient asks. **Never ask for photos** for this treatment.\n- **Pitch one package: 10ml for £1,500.** Never list the other packages unless the patient asks.\n- **Sell the clinic, not a discount.** Very high-end Harley Street clinic: trained, highly skilled doctors, premium products, everything sterilised, five-star service. We're not cheap, and we never pretend to be.\n- **Discretion is part of the service.** Calm, matter-of-fact and respectful. Never joke about it.\n- **Use the patient's words.** \"The girth you'd like to add\", \"more size when you're relaxed\", never just \"the area\".\n- **The £250 is part of the treatment, never an extra.**\n- **Always say rejuvenation**, never \"renewal\".\n- **Don't over-sell** to a patient who has done their research.\n- **Never promise results and never diagnose.** The doctor confirms suitability and the amount of filler at the consultation.", "h": "Golden rules"}, {"body": "1. **A very high-end clinic.** Award-winning, on Harley Street, founded by Dr Sherif Wakil. Our reputation matters, so every detail is done properly.\n2. **The most important organ, in the safest hands.** Trained, highly skilled doctors, premium products and fully sterilised tools.\n3. **Quick and comfortable.** 15 to 20 minutes maximum, with numbing cream. No general anaesthetic.\n4. **No surgery, no downtime.** Back to work straight away; consultation and treatment can be on the same day.\n5. **A natural product.** HA already exists in the body, and the body's own collagen sits in it.\n6. **Tailored.** The doctor recommends how many ml at the consultation, and explains bio-stimulators if they suit better.\n7. **Long-lasting.** About 15 to 18 months; top-ups usually need less filler.\n8. **Simple pricing.** Our most popular package is 10ml for £1,500, instead of £250 per ml.\n\n### The clinic's own line\n\"I can do sales on anything, but not my body.\" The penis is the most important organ, so quality, sterility and the doctor's skill matter more than price. Be honest: \"I won't tell you we're cheap, because we're not. We're a very high-end clinic.\" Then the low-risk next step: \"Start with the consultation and see the clinic for yourself.\"", "h": "Selling points"}, {"body": "**No photo step for this treatment, and the info email is optional** (only if the patient asks for it). The doctor assesses suitability and the amount of filler at the consultation, so you book on the call. Consultation and treatment can be on the same day.\n\n### Step 1: Open\n> Hi [name], it's [your name] from Dr SW Clinics. Thanks for your enquiry about our penis enlargement treatment, and just so you know, everything we talk about stays between you and the clinic. Tell me, what are you hoping to change: is it more girth, more length when you're relaxed, both, or is it more about how you feel in yourself?\n\nListen, then label:\n> It sounds like [the girth / your size when you're relaxed] has been on your mind for a while, and that is exactly what this treatment is designed for.\n\nThen ask, and listen (this shows what staying the same is costing them):\n> Can I ask, how long has [their concern] been bothering you?\n> And how does it make you feel day to day, in yourself and in your confidence?\n> Imagine a year from now, still feeling like that. Is that something you'd want?\n> The good news is it doesn't have to stay that way. Let me tell you how we can help.\n\nUse the patient's own words and keep it warm: the aim is to show what they stop living with, never to make them feel bad about how they look.\n\n### Step 2: The pitch (always, no skipping)\n> Let me explain how it works so you know exactly what to expect. It's a non-surgical treatment using hyaluronic acid filler. HA is something your body already has naturally, your own collagen actually sits in it, so it's a product your body knows. The doctor numbs the area with numbing cream, so you're comfortable, and there's no general anaesthetic. Then the doctor injects the filler through a single entry point and spreads it evenly along the shaft. It takes 15 to 20 minutes maximum, and you can go straight back to work. On average, patients see about 10 to 15% more girth and 5 to 10% more length when relaxed, and the results last around 15 to 18 months. There are also bio-stimulator fillers that work with your own collagen, and the doctor will tell you more about them at your consultation. And I want you to know where you'd be: we're a very high-end Harley Street clinic, and our reputation is very important to us. We use premium products, everything is sterilised, and you're treated by trained, highly skilled doctors. It's the most important organ, so that's exactly how it should be. Does that sound like what you've been looking for?\n\n**If the patient says \"I don't need any info\":**\n> Perfect, you clearly know what you want, so I'll keep it to 20 seconds. It's hyaluronic acid filler, with numbing cream first, and no general anaesthetic. It takes 15 to 20 minutes, you're back to work straight away, and it lasts around 15 to 18 months. And you're in a very high-end Harley Street clinic, with highly skilled doctors, premium products and everything sterilised. Does that sound like what you were looking for?\n\n**If the patient has done their research:**\n> You've clearly done your homework, so I won't repeat what you already know. What matters most is who does it and what they use: here you're with trained, highly skilled doctors, premium products and fully sterilised tools. The doctor will tailor the amount to you at the consultation.\n\n### Step 3: Screening questions\nSee the Screening questions section.\n\n### Step 4: The info email (only if the patient asks)\nThe email is not a must-do step. If the patient doesn't ask for it, go straight to Step 5.\n> Of course, I'll send you an email right now with all our information about the treatment, including a short video guide. Have a look while we're on the phone, and let's get your consultation booked in.\n\nIf the patient asks to send photos:\n> You don't need to send any photos for this one. The doctor will assess everything in person, privately, at your consultation and tailor the treatment to you.\n\n### Step 5: Expectations, deposit and booking\n> Just a heads-up, we're almost fully booked, so let's secure your place now. Filler is priced per ml, £250 a ml, but most of our patients go for our 10ml package, which is £1,500. The doctor confirms exactly how much is right for you at your consultation, and you can have your treatment the same day. To book you in on our system, you secure your consultation with £250, and that isn't an extra cost: it comes straight off your treatment. Which day suits you better, [day] or [day]?\n\nThree ways to frame the deposit:\n- **The head start:** \"Think of the £250 as your first payment towards your treatment. You're not paying for a consultation, you're paying towards your treatment.\"\n- **The split:** \"On the 10ml package, it's £250 now to lock in your time with the doctor, and the rest on the day.\"\n- **See it for yourself:** \"Start with the consultation and see the clinic for yourself. Meet the doctor, see how we work, and the full £250 counts towards your treatment.\"\n\nThen stop talking and wait. Never apologise for the deposit.\n\nThen book it as on the Clinic Process page: day and time, take the £250, ask for the postcode, add it on Zenoti. Finance patients: book **11am, 12pm or 1pm**.\n\n### Step 6: Clinic-led reassurance (when the patient is hesitant)\n> I'll be really honest with you. I can do sales on anything, but not on my body, and I'd never tell you we're the cheapest, because we're not. We're a very high-end clinic, and our reputation is very important to us. We use premium products, every tool is sterilised, and you're treated by trained, highly skilled doctors, with five-star service from the moment you walk in. You can start with the consultation and see the clinic for yourself. That's why patients travel to us from all over the UK, the USA, Dubai and Europe.\n\nNever name or criticise another clinic.", "h": "Call flow and approved scripts"}, {"body": "Only start after the pitch:\n> Now that you know how it works, I just need to ask a few quick questions so the doctor has everything ready for your consultation.\n\nOne at a time, write every answer down, stay calm and matter-of-fact, never tell the patient he is or isn't suitable. After any \"yes\": \"Thank you, I'll pass that on to the doctor.\" Put the answers in the Zenoti note.\n\n1. Can I take your full name, please?\n2. What is your date of birth, please?\n3. Do you smoke or drink alcohol? If so, how frequently?\n4. Do you have any medical conditions or ongoing health issues that we should be aware of?\n5. Are you currently taking any medications or regular treatments?\n6. Do you have any allergies or previous reactions to medications or treatments?\n7. What would you most like to change at the moment?\n8. Are you mainly looking for more girth, more length when relaxed, or both?\n9. How long has this been on your mind?\n10. Have you had any previous treatments or procedures on your penis, such as filler or surgery? If so, when and what treatment did you have?\n11. Do you take blood thinners, or have any bleeding or clotting problems?\n12. Do you have diabetes or an autoimmune condition, or do cuts and scrapes heal slowly for you?\n\nUse only these questions. Never add others.", "h": "Screening questions"}, {"body": "**Follow-through after every rebuttal:** (1) answer simply, (2) check: \"Is that the only thing, or is there anything else?\", (3) ask for the booking: \"Perfect. Which day suits you better for your consultation, [day] or [day]?\"\n\n**\"I want to talk to my wife / partner.\"**\n> Of course, that makes sense.\n> If it was just up to you, is this something you'd want to go ahead with?\n> What do you think their main question will be?\n> Would it help if I sent you the email with all our information, so you can show them?\n\n**\"I need to think about it.\"**\n> Of course, it's a big decision and I'd want to think about it too.\n> Usually when someone says that, it's one of three things: the treatment itself, the price, or the timing. Which one is it for you?\n> [Answer that one thing.]\n> Is that the only thing, or is there anything else?\n\n**\"I need to check and explore my options.\"**\n> That's smart, you should feel sure.\n> What matters most to you when you compare clinics?\n> When you compare, it's worth asking each clinic who does the treatment and what products and standards they use.\n> Shall I send you our information now so you have something to compare against?\n\n**\"I don't want to pay a deposit.\"**\n> It sounds like you want to be sure before you put money down, which makes complete sense.\n> The £250 isn't an extra charge. It comes straight off your treatment, so you're not spending anything you wouldn't spend on the treatment anyway.\n> Start with the consultation and see the clinic for yourself. The doctor confirms the treatment is right for you, and how much you need, before anything goes ahead.\n> Does that change how it feels for you?\n\nPause after each line and let the patient answer.\n\n**\"It's too expensive.\"**\n> That's fair, it is an investment.\n> I won't tell you we're cheap, because we're not. We're a very high-end clinic, with premium products, sterilised tools and highly skilled doctors.\n> When you say it's too expensive, is that compared with something you've seen, or with what you had in mind to spend?\n> What would you need to see or hear to feel confident this treatment is worth it for you?\n> When we spoke, you told me [their concern] has been on your mind and you want it done properly. Is that still how you feel?\n> Based on everything you've told me, which feels right for you: booking your consultation now, or leaving [their concern] as it is for now?\n\nAfter \"That's fair, it is an investment\", stop and wait; don't fill the silence. Pause after each line. Never defend the price or offer a discount. Don't offer 0% finance. Only if the patient asks to pay in instalments: \"Just the £250 up front, and the rest over 3, 6, 9 or 12 months with no interest. On the 10ml package, that's about £104 a month over 12 months, after the £250 deposit.\"\n\n**\"I've seen it cheaper elsewhere.\"**\n> You probably can.\n> When you say cheaper, are you talking about the same product, the same doctor's skill and the same standards, just at a lower price?\n> I always say I can do sales on anything, but not on my body. This is the most important organ, so who injects it and what goes in matters more than the price.\n> Here you're with trained, highly skilled doctors, premium products, and every tool is sterilised.\n> Which option gives you the most confidence that you'll get the result you're looking for safely?\n\nNever criticise another clinic.\n\nAfter \"You probably can.\", stop talking and let the patient fill the silence. Optional, only if the patient says the other clinic offers the same treatment:\n> And that's fair. The way I see it, the most expensive treatment isn't always the one with the highest price. It's the one you end up having to do twice. Which option gives you the most confidence you'll get it right the first time?\n\n**\"I need more time.\" / \"Maybe in a month or two.\"**\n> Sure, absolutely, take the time you need.\n> I just have one question: 30 days from now, what's going to change?\n> I ask because so many of our patients take their time, and once they've had the treatment, the only thing they tell us they regret is not doing it sooner.\n> So what's really holding you back right now? If there's a question I can answer, I'd love to help.\n\nPause after each line and let the patient answer.\n\n**\"It's not about the money.\"**\n> I completely understand, and I'm glad to hear that.\n> As long as we're on the same page that this is an investment in yourself, and it's absolutely worth it. When it comes to our face and our body, it's not something we shop around for a sale on, right?\n> Then let's go ahead and arrange your consultation. Which day works best for you, [day] or [day]?\n\n**\"Can I get a discount?\"**\n> That's a great question, and I get it. You want the best result for the best price, and that's exactly what we want for you too.\n> Can I ask you something? Would you get on a plane if the airline's slogan was \"Fly with us, our pilots work for the lowest wages\"?\n> Probably not, right? When something really matters, you want the best person in charge, not the cheapest.\n> It's the same with your body. Our prices are set by the clinic, because you're in the hands of our highly skilled doctors, and that's what gets you the result you're looking for.\n> Does that make sense?\n\nPause after each line. If this treatment has an ongoing offer on the Offers tab, share that offer exactly as written. Never invent a discount or criticise another clinic. Only mention 0% finance if the patient asks to pay in instalments.\n\n**\"I've been disappointed by a clinic before.\"**\n> I'm really sorry, that must have been frustrating.\n> What happened, if you don't mind me asking?\n> That's exactly why our consultations are designed around you. The doctor looks at your concern, your history and what you want to achieve before anything goes ahead, so nothing is decided for you.\n> What would you need to see from us to feel confident this time?\n\n**\"Why do I need a consultation? Can't I just book the treatment?\"**\n> I love that you're ready to go.\n> Every treatment is designed around the patient, so the doctor needs to confirm what's right for you first. That's how you get the result you want, not just a treatment.\n> And the £250 to secure it comes off your treatment, so it isn't an extra cost.\n> Which day works best for you, [day] or [day]?\n\n**\"Why is it priced per ml? How much will I need?\"**\n> It's priced by the amount of filler, £250 a ml, and most patients choose our 10ml package for £1,500. The doctor looks at what you'd like to achieve and confirms exactly how much is right for you at your consultation.\n\nOnly if he asks about more than 10ml, use the package table in At a glance.\n\n**\"Is it an offer? Will it be cheaper later?\"**\n> No, these are our standard package prices, they're always there. So there's no rush on price, the only thing that fills up is the doctor's diary.\n\n**\"Does it hurt?\"**\n> It sounds like comfort matters to you. We use numbing cream first, so you're comfortable, and there's no general anaesthetic. And it's 15 to 20 minutes maximum.\n\n**\"I'm scared it will go wrong / is it safe?\"**\n> It sounds like you want to feel safe, which is exactly right, it's the most important organ. That's why we only use premium products, every tool is sterilised, and you're treated by trained, highly skilled doctors. HA is something your body already has naturally. At your consultation, the doctor takes your full medical history and checks everything before anything goes ahead.\n\n**\"Will it look natural? Will anyone notice?\"**\n> The filler is spread evenly along the shaft through a single entry point, so the aim is a natural result. The doctor tailors the amount to you at the consultation.\n\n**\"Is there downtime?\"**\n> You can go straight back to work. You may have some minor bruising, tenderness or swelling, and the swelling settles in 24 to 48 hours. You avoid the gym and heavy lifting for a week, and sexual activity for 2 to 3 weeks, to avoid any risk of infection.\n\n**\"How long does it last? Is it permanent?\"** (only when the patient asks)\n> It's not permanent. HA is slowly absorbed by your body, and results last around 15 to 18 months. Top-ups usually need less filler. The doctor can also tell you about bio-stimulators, which work with your own collagen.\n\n**\"How much bigger will it be?\"**\n> Everyone is different, so I can't promise you an exact result. On average, patients see about 10 to 15% more girth, flaccid and erect, and 5 to 10% more length when relaxed, with less shrinkage. With more filler, girth can increase by up to 30 to 40%. The doctor will go through what's realistic for you at your consultation.\n\n**\"Just send me the details and I'll get back to you.\"**\n> Of course, I'm sending it right now, with all our information and a short video guide.\n> So you get the most out of it, which part matters most to you: how the treatment works, or what results to expect?\n> And while you're looking, shall I check which days the doctor has free this week, [day] or [day]?\n\n**\"I don't live in London.\"**\n> That's no problem at all, a lot of our patients don't. People travel to us from all over the UK, the USA, Dubai and Europe. You can have your consultation and treatment on the same day, so it's one trip, and the treatment itself takes 15 to 20 minutes.\n\n**\"Do I need to send photos first?\"**\n> No, not for this treatment. The doctor will assess everything in person, privately, at your consultation and tailor the treatment to you.\n\n**\"I feel embarrassed talking about this.\"**\n> That's completely normal, and you're definitely not the only one. Our doctors see this every day, everything stays between you and the clinic, and the consultation is private, one to one with the doctor.", "h": "Rebuttals"}, {"body": "Copy, fill in the [brackets], and send. **There is no photo-request email for this treatment.** The info email is optional: send it only when the patient asks for it. It carries the treatment page and a short video guide.\n\n**Discretion tip:** texts can pop up on a lock screen, so the SMS templates say \"men's enhancement treatment\". The emails use the full name.\n\n### SMS: no answer (1st attempt)\n!> Hi [Patient Name],\n!> It's [Patient Advisor Name] from Dr SW Clinics.\n!> I was just reviewing your enquiry about our men's enhancement treatment and wanted to quickly introduce myself.\n!> Just so I can point you in the right direction, would you say your main goal is:\n!> - more girth,\n!> - more length when relaxed,\n!> - both,\n!> - or something you'd rather talk through privately?\n!>\n!> Best,\n!> [Patient Advisor Name]\n\n### SMS: 1–2 days after sending the treatment info email\n!> Hi [Patient Name], hope you're doing well. Just checking in to see if you had a chance to look over the information I sent yesterday about our men's enhancement treatment.\n!> If any questions came up, or you'd like to talk through what you're hoping to achieve, just reply here. I'm happy to help, no rush at all.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: missed call\n!> Hi [Patient Name], looks like we missed each other on the phone just now. No worries at all. Is there a better time for me to call, or would you prefer to chat by text? I'm happy to help with any questions about the treatment.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: treatment info\n!> Subject: Your Penis Enlargement enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in Penis Enlargement with filler at DR SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> It's a non-surgical aesthetic treatment that increases the size of the penis using hyaluronic acid (HA) filler. HA is already found naturally in your body. The filler is injected through a single entry point and spread evenly along the shaft, after numbing cream is applied, so there is no general anaesthetic.\n!> The treatment takes 15 to 20 minutes, and most patients go straight back to work. You may have some minor bruising, tenderness or swelling, which usually settles within 24 to 48 hours. On average, patients see about 10–15% more girth and 5–10% more length when flaccid, and results typically last around 15 to 18 months; results vary from person to person.\n!> At your consultation, the doctor will take your medical history, confirm your suitability, recommend how much filler is right for you, and discuss the potential risks and alternatives, including bio-stimulator fillers. As it's non-surgical, you can have your consultation and treatment on the same day.\n!> Filler is priced at £250 per ml, and our most popular package is 10ml for £1,500; the exact cost will be confirmed at your consultation.\n!> The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> We're an award-winning Harley Street clinic. We use premium products, all our tools are sterilised, and you'll be treated by trained, highly skilled doctors, in complete confidence.\n!> You can read more about the treatment here:\n!> https://drswclinics.com/treatment/penis-enlargement-with-glans-filler/\n!> And watch a short guide to the treatment here:\n!> https://www.youtube.com/watch?v=IZGwW_0B2Ow\n!> To book your consultation, just reply with a day that suits you. Could you also reply with your postcode so I can update your details?\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: did not dial (DND)\n!> Subject: Your Penis Enlargement enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in Penis Enlargement with filler at DR SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> It's a non-surgical aesthetic treatment that increases the size of the penis using hyaluronic acid (HA) filler, with numbing cream and no general anaesthetic. The treatment takes 15 to 20 minutes, most patients go straight back to work, and results typically last around 15 to 18 months; results vary from person to person.\n!> At your consultation, the doctor will confirm your suitability and recommend how much filler is right for you. You can have your consultation and treatment on the same day.\n!> Filler is priced at £250 per ml, and our most popular package is 10ml for £1,500; the exact cost will be confirmed at your consultation. The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> What would you most like to achieve: more girth, more length when relaxed, or both? Reply with your main goal and a convenient time to speak, and I'll help arrange the next step. Everything you share stays between you and the clinic.\n!> You can read more about the treatment here:\n!> https://drswclinics.com/treatment/penis-enlargement-with-glans-filler/\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: phone number not working\n!> Subject: Quick question about your enquiry at Dr SW Clinics\n!>\n!> Hi [Patient Name],\n!>\n!> Thank you for your enquiry about Penis Enlargement with filler at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd love to help you with any questions.\n!>\n!> I tried to call you, but I couldn't get through on the number we have on file. It may have been entered incorrectly.\n!>\n!> Could you please reply with the best number to reach you, including the country code? It would also help to know a good day and time to call.\n!>\n!> If you'd rather chat by email, that's absolutely fine too. Just reply here with any questions.\n!>\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics", "h": "Messages and emails"}, {"body": "**What exactly is the treatment?** \"It's a non-surgical penis enlargement using hyaluronic acid filler. It's an aesthetic treatment that adds size.\"\n\n**Is it surgery?** \"No, it's non-surgical. No scalpel, no operating theatre and no general anaesthetic.\"\n\n**What is hyaluronic acid?** \"It's something your body already has naturally. Your own collagen actually sits in it, so it's a product your body knows.\"\n\n**Are there other fillers?** \"Yes, there are bio-stimulators, like Ellansé and Radiesse, which stimulate your own collagen. The doctor will tell you more at your consultation.\"\n\n**Will I be put to sleep?** \"No. We use numbing cream only, so there's no general anaesthetic.\"\n\n**How long does it take?** \"15 to 20 minutes maximum.\"\n\n**Does it hurt?** \"We use numbing cream first, so you're comfortable.\"\n\n**How many sessions will I need?** \"Usually one treatment.\"\n\n**How much filler will I need?** \"The doctor confirms that with you at your consultation. Most patients choose our 10ml package.\"\n\n**How long do results last?** \"Around 15 to 18 months, as your body slowly absorbs the HA. Top-ups usually need less filler.\"\n\n**How much bigger will it be?** \"Everyone is different. On average, patients see about 10 to 15% more girth and 5 to 10% more length when relaxed, with less shrinkage, and up to 30 to 40% more girth with more filler. The doctor goes through what's realistic for you.\"\n\n**Is there downtime?** \"You can go straight back to work. Avoid strenuous exercise and heavy lifting for a week, and sexual activity for 2 to 3 weeks.\"\n\n**Is it safe?** \"We use premium products, every tool is sterilised, and you're treated by trained, highly skilled doctors. The doctor takes your full medical history before anything goes ahead.\"\n\n**Am I suitable?** \"Most men are, but the doctor confirms it at your consultation.\"\n\n**Do I need to send photos?** \"No, not for this treatment. The doctor assesses everything in person, privately, at the consultation.\"\n\n**How much does it cost?** \"It's £250 per ml, and most patients choose our 10ml package for £1,500. The doctor confirms the exact amount at your consultation, and your £250 deposit comes off it.\"\n\n**Is the package an offer?** \"No, it's our standard package price. It's always there.\"\n\n**Why do I need to pay a deposit?** \"It holds your appointment on our system, and it isn't extra: the full £250 is redeemed against your treatment.\"\n\n**Is the deposit refundable?** \"Refund requests go through an eligibility review. Once a request is approved, the refund can take up to 28 working days to process.\" Don't raise refunds unless asked.\n\n**Can I pay monthly?** \"Yes. We have 0% finance over 3, 6, 9 or 12 months. You pay just the £250 up front, and the rest in instalments with no interest.\" (Only when the patient asks.)\n\n**Is it discreet?** \"Completely. Everything stays between you and the clinic, and the consultation is one to one with the doctor.\"\n\n**Can I have the consultation and treatment on the same day?** \"Yes. It's a non-surgical treatment, so you can have both on the same day.\"\n\n**Can I book today?** \"Yes. Let's find a day that suits you, secure it with the £250, and you're in.\"\n\nStill to be confirmed by management: which doctors perform this treatment. Never promise an outcome.", "h": "FAQs"}, {"body": "- \"Unfortunately…\" or \"I'm afraid…\"\n- \"Consultation fee\" or \"extra charge\" for the £250. Say \"secure\", \"hold\" or \"reserve\".\n- \"Renewal\". Always say **rejuvenation**.\n- \"Guaranteed\", \"permanent\", \"risk-free\", \"no bruising\", a size in inches or centimetres, or any percentage other than the website's averages.\n- \"Cheap\", \"bargain\" or \"deal\". We're a very high-end clinic.\n- \"Offer\", \"special\" or \"limited time\" for the packages. They're permanent prices.\n- The old \"£999 for 10ml\". That offer has ended.\n- The 15ml, 20ml or 24ml packages unless the patient asks about more than 10ml.\n- \"General anaesthetic\" or \"you'll be put to sleep\". We use numbing cream.\n- Glans filler. It's a different treatment.\n- \"Send me your photos\". This treatment needs no photo assessment.\n- That it treats erectile dysfunction or any medical condition. It's aesthetic, for size only.\n- Jokes, slang or anything that could embarrass the patient.\n- Anything that diagnoses, or tells a patient he is or isn't suitable.\n- A screening question or the deposit before the treatment has been explained.\n- A discount, or 0% finance before the patient asks to pay in instalments.\n- Anything negative about another clinic.", "h": "Never say"}], "title": "Penis Enlargement (Filler)", "updatedAt": 1793213830253, "updatedBy": null}}, {"id": "vampire-prp-face-lift", "data": {"kind": "treatment", "order": 30, "sections": [{"body": "- **Treatment:** the Vampire Facelift™, a non-surgical skin rejuvenation treatment that boosts the skin and gives it a lifted look.\n- **Product:** platelet-rich plasma (PRP) from the patient's own blood, combined with a small amount of hyaluronic acid dermal filler.\n- **How it works:** a small blood sample is spun in a centrifuge to separate the PRP. The doctor injects it back with the \"sandwich technique\": deep injections stimulate collagen, superficial injections refresh the outer layer of the skin.\n- **Treats:** ageing skin, volume loss and sagging skin.\n- **Time:** about 40 minutes.\n- **Comfort:** numbing cream if needed. Many patients feel no pain.\n- **Back to work:** immediately. Redness usually fades within a couple of hours; any minor bruising settles in 1–2 days.\n- **Results:** 12–24 months with a good skincare routine. They vary by individual.\n- **Suits:** men and women over 18, any skin type, subject to consultation.\n- **Not suitable for:** platelet dysfunction syndrome, sepsis, chronic liver disease, pregnancy or breastfeeding.\n- **Authority:** Dr SW was one of the doctors who first suggested using PRP on the face, and is the only doctor in the UK and in Europe certified by the inventor of the Vampire treatments.\n- **Price:** as on the price list: from **£1,000**, or **£2,500 for 3 monthly sessions**. £1,000 is the minimum treatment price, not counting the consultation. The doctor confirms the final cost at consultation.\n- **Deposit:** £250 secures the consultation and is redeemed against the treatment.\n- **Finance:** 0% over 3, 6, 9 or 12 months (the treatment is £1,000 or more). Don't offer it; only mention it if the patient asks to pay in instalments. The £250 deposit is paid up front and never included in the instalments: divide the balance (price minus £250) by the months. £1,000 → £750 balance: £250 / £125 / £83.33 / £62.50 a month over 3 / 6 / 9 / 12 months. £2,500 → £2,250 balance: £750 / £375 / £250 / £187.50 a month.\n- **Entry step:** **no photos and no photo assessment.** Send the info email, take the £250 deposit and book the consultation on the call. Consultation and treatment can be on the same day.\n- **Sessions:** the doctor decides the number of sessions at the consultation.\n\n### Not one treatment fits all\nEvery treatment is designed around the patient's needs. That is why the patient has a consultation with the doctor before anything goes ahead.", "h": "At a glance"}, {"body": "- **Always pitch the treatment**, even if the patient says they don't need any info.\n- **Explain first, screen second.**\n- **Be confident.** No \"unfortunately\", no \"I'm afraid\".\n- **One path, no options.** Email, deposit, booking, consultation with the doctor. **Never ask for photos** for this treatment.\n- **Lead with Dr SW.** One of the doctors who first suggested PRP for the face, and the only doctor in the UK and Europe certified by the inventor of the Vampire treatments.\n- **Use the patient's words.** \"Your skin looking tired\", \"the volume you've lost\", never just \"the area\".\n- **The £250 is part of the treatment, never an extra.**\n- **Always say rejuvenation**, never \"renewal\".\n- **Don't over-sell** to a patient who has done their research.\n- **Never promise results and never diagnose.** The doctor confirms suitability at the consultation.", "h": "Golden rules"}, {"body": "1. **The doctor who helped start it.** Dr SW was one of the doctors who first suggested using PRP on the face, and is the only UK and European doctor certified by the inventor of the Vampire treatments.\n2. **Your own plasma.** Prepared from the patient's own blood with a sterile, single-use kit.\n3. **Rejuvenation from the inside out.** Stimulates collagen and refreshes the skin for a boost and a lifted look.\n4. **No surgery, no downtime.** About 40 minutes, back to work immediately, and consultation and treatment can be on the same day.\n5. **Long-lasting.** 12–24 months with a good skincare routine.\n6. **Comfortable.** Numbing cream if needed; many patients feel no pain.\n7. **Suits most people.** Men and women over 18 with any skin type, subject to consultation.\n8. **Award-winning Harley Street clinic.** 77 Harley Street, London.", "h": "Selling points"}, {"body": "**No photo step for this treatment.** The doctor assesses suitability at the consultation, so you book on the call. Consultation and treatment can be on the same day.\n\n### Step 1: Open\n> Hi [name], it's [your name] from Dr SW Clinics. Thanks for your enquiry about our Vampire PRP Face Lift. Tell me, what's bothering you most about your skin at the moment: is it looking tired or dull, losing volume, sagging, or fine lines and wrinkles?\n\nListen, then label:\n> It sounds like [your skin looking tired / the volume you've lost in your cheeks] is really getting to you, and that is exactly what this treatment is designed for.\n\nThen ask, and listen (this shows what staying the same is costing them):\n> Can I ask, how long has [their concern] been bothering you?\n> And how does it make you feel day to day, when you look in the mirror or see yourself in photos?\n> Imagine a year from now, still feeling like that. Is that something you'd want?\n> The good news is it doesn't have to stay that way. Let me tell you how we can help.\n\nUse the patient's own words and keep it warm: the aim is to show what they stop living with, never to make them feel bad about how they look.\n\n### Step 2: The pitch (always, no skipping)\n> Let me tell you why patients who feel exactly like you do about [their concern] choose this treatment. It's a non-surgical rejuvenation treatment that uses your own body to boost your skin. We take a small blood sample and spin it using a blood centrifuge machine to separate the platelet-rich plasma, and the doctor injects it back into your face. The deeper injections stimulate your own collagen, and the ones closer to the surface refresh your skin, so you get a real boost and a lifted look. It takes about 40 minutes, we use numbing cream if you need it, and you can go straight back to work. And with a good skincare routine, the results last 12 to 24 months. Something that reassures a lot of our patients: Dr SW was one of the doctors who first suggested using PRP on the face, and he's the only doctor in the UK and in Europe certified by the inventor of the Vampire treatments. So you'd be treated by one of the people who started it. Is that the kind of change you've been hoping for?\n\n**If the patient says \"I don't need any info\":**\n> Perfect, you clearly know what you want, so I'll keep it to 20 seconds. We use your own platelet-rich plasma to boost your collagen and refresh your skin for a lifted look. It's about 40 minutes, you're back to work straight away, and results last 12 to 24 months with good skincare. And Dr SW was one of the doctors who first suggested PRP for the face, so you're in the most experienced hands. Does that sound like what you were looking for?\n\n**If the patient has done their research:**\n> You've clearly done your homework, so I won't repeat what you already know. You've probably seen that Dr SW is the only doctor in the UK and Europe certified by the inventor of the Vampire treatments, so you're in very good hands. The doctor will tailor the treatment to your skin at the consultation.\n\n### Step 3: Screening questions\nSee the Screening questions section.\n\n### Step 4: The info email\n> Here's what happens next. I'm sending you an email right now with all our information about the treatment, including the link to our before and after pictures. Have a look while we're on the phone, and let's get your consultation with Dr SW booked in.\n\nIf the patient asks to send photos:\n> You don't need to send any photos for this one. The doctor will look at your skin properly in person at your consultation and tailor the treatment to you.\n\n### Step 5: Expectations, deposit and booking\n> Just a heads-up, we're almost fully booked, so let's secure your place with Dr SW now. The treatment starts from £1,000, and the doctor confirms the exact plan for your skin, including how many sessions, at your consultation, and you can have your treatment the same day. To book you in on our system, you secure your consultation with £250, and that isn't an extra cost: it comes straight off your treatment. Which day suits you better, [day] or [day]?\n\nThree ways to frame the deposit:\n- **The head start:** \"Think of the £250 as your first payment towards your rejuvenation. You're not paying for a consultation, you're paying towards your treatment.\"\n- **The split:** \"It's £250 now to lock in your time with Dr SW, and the rest on the day.\"\n- **The commitment:** \"The deposit is how we hold a dedicated slot with the doctor just for you, and the full £250 counts towards your treatment.\"\n\nThen stop talking and wait. Never apologise for the deposit.\n\nThen book it as on the Clinic Process page: day and time, take the £250, ask for the postcode, add it on Zenoti. Finance patients: book **11am, 12pm or 1pm**.\n\n### Step 6: Doctor-led reassurance (when the patient is hesitant)\n> Something that reassures a lot of our patients: Dr SW was one of the doctors who first suggested using PRP on the face, and he's the only doctor in the UK and in Europe certified by the inventor of the Vampire treatments. So you're not going to someone who learned it last year, you're going to one of the people who started it. That's why patients travel to us from all over the UK, the USA, Dubai and Europe.\n\nNever name or criticise another clinic.", "h": "Call flow and approved scripts"}, {"body": "Only start after the pitch:\n> Now that you know how it works, I just need to ask a few quick questions so the doctor has everything ready for your consultation.\n\nOne at a time, write every answer down, never tell the patient they are or aren't suitable. After any \"yes\": \"Thank you, I'll pass that on to the doctor.\" Put the answers in the Zenoti note.\n\n1. Can I take your full name, please?\n2. What is your date of birth, please?\n3. Do you smoke or drink alcohol? If so, how frequently?\n4. Do you have any medical conditions or ongoing health issues that we should be aware of?\n5. Are you currently taking any medications or regular treatments?\n6. Do you have any allergies or previous reactions to medications or treatments?\n7. What concerns you most about your skin at the moment?\n8. Have you noticed any dullness, loss of volume, sagging, fine lines or tiredness in your face?\n9. How long have you been noticing these changes?\n10. Have you had any previous treatments or procedures on your face? If so, when and what treatment did you have?\n11. Do you take blood thinners, or have any bleeding or clotting problems?\n12. Do you have diabetes or an autoimmune condition, or do cuts and scrapes heal slowly for you?\n\nUse only these questions. Never add others.", "h": "Screening questions"}, {"body": "**Follow-through after every rebuttal:** (1) answer simply, (2) check: \"Is that the only thing, or is there anything else?\", (3) ask for the booking: \"Perfect. Which day suits you better for your consultation with Dr SW, [day] or [day]?\"\n\n**\"I want to talk to my husband / partner.\"**\n> Of course, that makes sense.\n> If it was just up to you, is this something you'd want to go ahead with?\n> What do you think their main question will be?\n> Would it help if I sent you the email with the link to our before and afters, so you can show them?\n\n**\"I need to think about it.\"**\n> Of course, it's a big decision and I'd want to think about it too.\n> Usually when someone says that, it's one of three things: the treatment itself, the price, or the timing. Which one is it for you?\n> [Answer that one thing.]\n> Is that the only thing, or is there anything else?\n\n**\"I need to check and explore my options.\"**\n> That's smart, you should feel sure.\n> What matters most to you when you compare clinics?\n> When you compare, it's worth asking each clinic who does the treatment and to see their before and afters.\n> Shall I send you ours now so you have something to compare against?\n\n**\"I don't want to pay a deposit.\"**\n> It sounds like you want to be sure before you put money down, which makes complete sense.\n> The £250 isn't an extra charge. It comes straight off your treatment, so you're not spending anything you wouldn't spend on the treatment anyway.\n> And it holds a dedicated slot with Dr SW, one of the doctors who first suggested PRP for the face. At your consultation he confirms the treatment is right for your skin before anything goes ahead.\n> Does that change how it feels for you?\n\nPause after each line and let the patient answer.\n\n**\"It's too expensive.\"**\n> That's fair, it is an investment.\n> When you say it's too expensive, is that compared with something you've seen, or with what you had in mind to spend?\n> What would you need to see or hear to feel confident this treatment is worth it for you?\n> When we spoke, you told me [their concern] really bothers you and you want it done properly. Is that still how you feel?\n> Based on everything you've told me, which feels right for you: booking your consultation with Dr SW now, or leaving [their concern] as it is for now?\n\nAfter \"That's fair, it is an investment\", stop and wait; don't fill the silence. Pause after each line. Never defend the price or offer a discount. Don't offer 0% finance. Only if the patient asks to pay in instalments: \"Just the £250 up front, and the rest over 3, 6, 9 or 12 months with no interest. On a £1,000 treatment, that's £62.50 a month over 12 months, after the £250 deposit.\" (£2,500 package: £187.50 a month over 12 months.)\n\n**\"I've seen it cheaper elsewhere.\"**\n> You probably can.\n> When you say cheaper, are you talking about the same treatment and the same result, just at a lower price?\n> What have you seen from the other clinic that gives you confidence you'll get the same result?\n> Something worth knowing: Dr SW is the only doctor in the UK and Europe certified by the inventor of the Vampire treatments.\n> Which option gives you the most confidence that you'll get the result you're looking for?\n\nNever criticise another clinic.\n\nAfter \"You probably can.\", stop talking and let the patient fill the silence. Optional, only if the patient says the other clinic offers the same treatment:\n> And that's fair. The way I see it, the most expensive treatment isn't always the one with the highest price. It's the one you end up having to do twice. Which option gives you the most confidence you'll get it right the first time?\n\n**\"I need more time.\" / \"Maybe in a month or two.\"**\n> Sure, absolutely, take the time you need.\n> I just have one question: 30 days from now, what's going to change?\n> I ask because so many of our patients take their time, and once they've had the treatment, the only thing they tell us they regret is not doing it sooner.\n> So what's really holding you back right now? If there's a question I can answer, I'd love to help.\n\nPause after each line and let the patient answer.\n\n**\"It's not about the money.\"**\n> I completely understand, and I'm glad to hear that.\n> As long as we're on the same page that this is an investment in yourself, and it's absolutely worth it. When it comes to our face and our body, it's not something we shop around for a sale on, right?\n> Then let's go ahead and arrange your consultation. Which day works best for you, [day] or [day]?\n\n**\"Can I get a discount?\"**\n> That's a great question, and I get it. You want the best result for the best price, and that's exactly what we want for you too.\n> Can I ask you something? Would you get on a plane if the airline's slogan was \"Fly with us, our pilots work for the lowest wages\"?\n> Probably not, right? When something really matters, you want the best person in charge, not the cheapest.\n> It's the same with your face. Our prices are set by the clinic, because you're in the hands of Dr SW and his team, and that's what gets you the result you're looking for.\n> Does that make sense?\n\nPause after each line. If this treatment has an ongoing offer on the Offers tab, share that offer exactly as written. Never invent a discount or criticise another clinic. Only mention 0% finance if the patient asks to pay in instalments.\n\n**\"I've been disappointed by a clinic before.\"**\n> I'm really sorry, that must have been frustrating.\n> What happened, if you don't mind me asking?\n> That's exactly why our consultations are designed around you. The doctor looks at your concern, your history and what you want to achieve before anything goes ahead, so nothing is decided for you.\n> What would you need to see from us to feel confident this time?\n\n**\"Why do I need a consultation? Can't I just book the treatment?\"**\n> I love that you're ready to go.\n> Every treatment is designed around the patient, so the doctor needs to confirm what's right for you first. That's how you get the result you want, not just a treatment.\n> And the £250 to secure it comes off your treatment, so it isn't an extra cost.\n> Which day works best for you, [day] or [day]?\n\n**\"Does it hurt?\"**\n> It sounds like comfort matters to you. There are injections involved, but we use numbing cream first, and many of our patients tell us they feel no pain at all. And it's about 40 minutes.\n\n**\"I don't like needles / the idea of my blood being taken.\"**\n> That's completely understandable, and you're not the only one. It's a small blood sample, the same as a routine blood test, taken with a sterile, single-use kit. What goes back into your skin is your own plasma, and we use numbing cream so you're comfortable.\n\n**\"Will people notice? Is there downtime?\"**\n> Most people go straight back to work. You may have some pink marks where the injections were, which usually fade within a couple of hours, and any minor bruising settles in a day or two. If there's an event coming up, we'll plan your appointment around it.\n\n**\"How long does it last?\"** (only when the patient asks)\n> Great question. With a good skincare routine, results last 12 to 24 months. The doctor will go through exactly what to expect for your skin.\n\n**\"Why 3 sessions?\"**\n> Every treatment is designed around your skin, so the doctor decides how many sessions you need with you at your consultation. If you need more than one, there's a package of 3 monthly sessions for £2,500, and the doctor will talk you through it.\n\n**\"Will it look fake or overdone?\"**\n> It sounds like you want to look like yourself, just fresher, which is exactly the idea. It works with your own plasma to boost your collagen and rejuvenate your skin, so the aim is a natural, refreshed, lifted look. Dr SW tailors it to your face.\n\n**\"I'm scared it will go wrong / is it safe?\"**\n> It sounds like you want to feel safe, which is exactly right. It uses your own plasma, prepared with a sterile, single-use kit, and you're treated by the doctor who is certified by the inventor of the Vampire treatments. At your consultation, Dr SW checks everything before anything goes ahead.\n\n**\"Just send me the details and I'll get back to you.\"**\n> Of course, I'm sending it right now, with the link to our before and afters.\n> So you get the most out of it, which part matters most to you: the before and afters, or what the treatment involves?\n> And while you're looking, shall I check which days Dr SW has free this week, [day] or [day]?\n\n**\"I don't live in London.\"**\n> That's no problem at all, a lot of our patients don't. People travel to us from all over the UK, the USA, Dubai and Europe. You can have your consultation and treatment on the same day, so it's one trip, and the treatment itself is about 40 minutes.\n\n**\"Do I need to send photos first?\"**\n> No, not for this treatment. The doctor will look at your skin in person at your consultation and tailor everything to you.", "h": "Rebuttals"}, {"body": "Copy, fill in the [brackets], and send. **There is no photo-request email and no testimonial videos for this treatment**: the treatment page link carries the before and afters.\n\n### SMS: no answer (1st attempt)\n!> Hi [Patient Name],\n!> It's [Patient Advisor Name] from Dr SW Clinics.\n!> I was just reviewing your enquiry about the Vampire PRP Face Lift and wanted to quickly introduce myself.\n!> Just so I can point you in the right direction, would you say your main concern is:\n!> - skin looking tired or dull,\n!> - loss of volume,\n!> - sagging or loose skin,\n!> - fine lines/wrinkles,\n!> - or a combination of those?\n!>\n!> Best,\n!> [Patient Advisor Name]\n\n### SMS: 1–2 days after sending the treatment info email\n!> Hi [Patient Name], hope you're doing well. Just checking in to see if you had a chance to look over the information I sent yesterday about the Vampire PRP Face Lift.\n!> If any questions came up, or you'd like to talk through what you're hoping to address, just reply here. I'm happy to help, no rush at all.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: missed call\n!> Hi [Patient Name], looks like we missed each other on the phone just now. No worries at all. Is there a better time for me to call, or would you prefer to chat by text? I'm happy to help with any questions about the treatment.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: treatment info and before-and-afters\n!> Subject: Your Vampire PRP Face Lift enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in the Vampire PRP Face Lift at DR SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> The Vampire Facelift™ is a non-surgical rejuvenation treatment that uses platelet-rich plasma (PRP) from your own blood, combined with a small amount of hyaluronic acid filler, to boost your skin and give it a lifted look. Deeper injections stimulate your own collagen, and more superficial injections refresh the outer layer of the skin. It's designed to help with ageing skin, volume loss and sagging skin.\n!> Treatment takes about 40 minutes, and most patients go straight back to work. Redness usually fades within a couple of hours, and any minor bruising settles within a day or two. With a good skincare routine, results can last 12–24 months; results vary from person to person.\n!> Your treatment is with Dr Sherif Wakil, one of the doctors who first suggested using PRP on the face, and the only doctor in the UK and in Europe certified by the inventor of the Vampire treatments. At your consultation he will assess your skin, recommend how many sessions you need, tailor the treatment to your goals, and discuss the potential risks and alternatives with you. As it's non-surgical, you can have your consultation and treatment on the same day.\n!> The clinic's published price starts from £1,000, or £2,500 for 3 monthly sessions; the exact cost will be confirmed at your consultation.\n!> The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> You can read more about the treatment and view before-and-after examples here:\n!> https://drswclinics.com/treatment/vampire-prp-face-lift/\n!> To book your consultation, just reply with a day that suits you. Could you also reply with your postcode so I can update your details?\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: did not dial (DND)\n!> Subject: Your Vampire PRP Face Lift enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in the Vampire PRP Face Lift at DR SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> The Vampire Facelift™ is a non-surgical rejuvenation treatment that uses platelet-rich plasma (PRP) from your own blood, combined with a small amount of hyaluronic acid filler, to boost your skin and give it a lifted look. It's designed to help with ageing skin, volume loss and sagging skin. Treatment takes about 40 minutes, most patients go straight back to work, and with a good skincare routine results can last 12–24 months; results vary from person to person.\n!> Your treatment is with Dr Sherif Wakil, one of the doctors who first suggested using PRP on the face, and the only doctor in the UK and in Europe certified by the inventor of the Vampire treatments. You can have your consultation and treatment on the same day.\n!> The clinic's published price starts from £1,000, or £2,500 for 3 monthly sessions; the exact cost will be confirmed at your consultation. The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> What would you most like to address: skin looking tired or dull, loss of volume, or sagging skin? Reply with your main concern and a convenient time to speak, and I'll help arrange the next step.\n!> You can read more about the treatment and view before-and-after examples here:\n!> https://drswclinics.com/treatment/vampire-prp-face-lift/\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: phone number not working\n!> Subject: Quick question about your enquiry at Dr SW Clinics\n!>\n!> Hi [Patient Name],\n!>\n!> Thank you for your enquiry about the Vampire PRP Face Lift at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd love to help you with any questions.\n!>\n!> I tried to call you, but I couldn't get through on the number we have on file. It may have been entered incorrectly.\n!>\n!> Could you please reply with the best number to reach you, including the country code? It would also help to know a good day and time to call.\n!>\n!> If you'd rather chat by email, that's absolutely fine too. Just reply here with any questions.\n!>\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics", "h": "Messages and emails"}, {"body": "**What exactly is the treatment?** \"It's the Vampire Facelift, a non-surgical rejuvenation treatment. We use platelet-rich plasma from your own blood, with a small amount of hyaluronic acid filler, to boost your skin and give it a lifted look.\"\n\n**Is it surgery?** \"No, it's non-surgical. No scalpel and no operating theatre.\"\n\n**How does it work?** \"We take a small blood sample and spin it using a blood centrifuge machine to separate the plasma. The doctor injects it deep to stimulate your collagen, and closer to the surface to refresh your skin.\"\n\n**What does it treat?** \"Ageing skin, volume loss and sagging skin.\"\n\n**How long does it take?** \"About 40 minutes.\"\n\n**Does it hurt?** \"There are injections, but we use numbing cream, and many patients feel no pain.\"\n\n**Is there downtime?** \"Very little. You can go straight back to work. Redness usually fades within a couple of hours, and any minor bruising settles within a couple of days.\"\n\n**How long do results last?** \"12 to 24 months with a good skincare routine.\"\n\n**Is it safe?** \"It uses your own blood, prepared with a sterile, single-use kit, and Dr SW checks everything at your consultation before treatment.\"\n\n**Who is the doctor?** \"Dr Sherif Wakil. He was one of the doctors who first suggested using PRP on the face, and he's the only doctor in the UK and in Europe certified by the inventor of the Vampire treatments.\"\n\n**Am I suitable?** \"It suits men and women over 18 with any skin type. Dr SW confirms it's right for you at your consultation.\"\n\n**Do I need to send photos?** \"No, not for this treatment. The doctor sees your skin in person at the consultation.\"\n\n**How much does it cost?** \"It starts from £1,000, or £2,500 for 3 monthly sessions. The doctor confirms the exact cost at your consultation, and your £250 deposit comes off it.\"\n\n**Why do I need to pay a deposit?** \"It holds your appointment with Dr SW on our system, and it isn't extra: the full £250 is redeemed against your treatment.\"\n\n**Is the deposit refundable?** \"Refund requests go through an eligibility review. Once a request is approved, the refund can take up to 28 working days to process.\" Don't raise refunds unless asked.\n\n**Can I pay monthly?** \"Yes. We have 0% finance over 3, 6, 9 or 12 months. You pay just the £250 up front, and the rest in instalments with no interest.\"\n\n**Can I see before and after photos?** \"Absolutely, they're on the treatment page, and I'm sending you the link now.\"\n\n**How many sessions will I need?** \"The doctor decides that with you at your consultation, based on your skin and what you'd like to achieve.\"\n\n**Can I have the consultation and treatment on the same day?** \"Yes. It's a non-surgical treatment, so you can have both on the same day.\"\n\n**Can I book today?** \"Yes. Let's find a day that suits you, secure it with the £250, and you're in with Dr SW.\"\n\nStill to be confirmed by management: when results start to show, and whether filler is always included. Never promise an outcome.", "h": "FAQs"}, {"body": "- \"Unfortunately…\" or \"I'm afraid…\"\n- \"Consultation fee\" or \"extra charge\" for the £250. Say \"secure\", \"hold\" or \"reserve\".\n- \"Renewal\". Always say **rejuvenation**.\n- \"Guaranteed\", \"permanent\", \"risk-free\", \"no bruising\", \"you'll look 10 years younger\".\n- \"Surgical facelift\" or anything that suggests an operation.\n- \"Send me your photos\". This treatment needs no photo assessment.\n- \"You'll need one session\" or \"you'll need three\". The doctor decides at the consultation.\n- Anything that diagnoses, or tells a patient they are or aren't suitable.\n- A screening question or the deposit before the treatment has been explained.\n- A discount, or 0% finance before the patient asks to pay in instalments.\n- Anything negative about another clinic.", "h": "Never say"}], "title": "Vampire PRP Face Lift", "updatedAt": 1793213830253, "updatedBy": null}}], "kbimg": [{"id": "zenoti", "data": {"z3": "data:image/webp;base64,UklGRhYkAABXRUJQVlA4IAokAAAw1QCdASq8AggCPp1OoU0lpCMiIjOI+LATiWdu4XaBlfnirOMAH6hh5f4HF/zJVX+Q/ucyfU3Gnuuehn/2enp6dfRTzuf/K/dP3W/2r0mfR7/2f//9xn+sf8H//+4B/K/9L///a19Wf/Pek/6AH//4I/yf/VPx98Df7n+P/9k9Mfxf59/B/mj67+PvqI1I/kn2P/F/2j92/7r82P2n/a/4Dxh+JP9d6gXrL/Sfbt6gOyO1T/P/8b1AvXT59/rP75/fv+h5hv8z/dfUz89/vf/E9wD+Yf1//kf3z2P/5Pgw/cv9Z7A/9E/un/d/ynuv/0H/q/y35de2X9E/y3/v/0XwFfzv+0f9f/Fe3J7Mv3e9nH9sf/+HnBEAcTSmt0NBrfH9a7/S5HUq/x+lyOpV/j9LkdSr/H56++3Q6X6JDvlAPl12I+R5py0Xmu9/rTHYMbcfGEl7jGzpXK7LFips+EEygILA4ocDFsHDYIYR6orx28ridvK2hBkZW+gqDlVXHwwDBTI56ebDgwZIfaEX2ZVQu9GT5RvSKwjabcYMi+bIAbJJZQuzIL4PW6r9W8n+AuHwYgyMCCan1n0XA7v8Yb5TAToVsvpD0y6p41IAB7wPBj8esE1i1+TU9CXFvRtCRgZr3ETa/88xeX+ZAoBmqrYLAl2npS8NlRXR8kaBlzbGoKZzk9onMGkiMRWU0g7yhyFk1mS3BKucTtnS7CW2bBHS12wouSziwxwqEXvTjPXa3gM3yzeEFz1j9LkdSr6Sdd8BWE0DYgHNCbM2wH2A+wH2A+wH2A+wH2A+wH2A+wH2A+wH2A+wH2A+wYsEPmYSX2Tu9PHgaJa58ReCRZZT
