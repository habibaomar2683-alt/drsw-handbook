<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dr SW Agent Handbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
/* Layout: dark clinic header band, left topic rail + reading column; editor replaces the reading column for managers. */
:root{
  --ink:#101315;          /* Dr SW near-black */
  --gold:#C6A84C;         /* Dr SW gold */
  --gold-deep:#8C7228;    /* gold for text on light grounds */
  --mist:#DFE7EB;         /* Dr SW blue-grey */
  --bg:#F5F5F5;
  --surface:#FFFFFF;
  --text:#212121;
  --muted:#5B6166;
  --line:#E2E4E3;
  --gold-text:var(--gold-deep);
  --gold-wash:rgba(198,168,76,.12);
  --danger:#A3352B;
  --ok:#2F6B4A;
  --header-bg:var(--ink);
  --header-fg:#F5F5F5;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E10;--surface:#15191C;--text:#E9E7E1;--muted:#9AA1A6;--line:#262B2F;
  --gold-text:#D4B95F;--gold-wash:rgba(198,168,76,.14);--mist:#1E2529;--danger:#E07A6F;--ok:#7FC39C;
  --header-bg:#08090A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E10;--surface:#15191C;--text:#E9E7E1;--muted:#9AA1A6;--line:#262B2F;
  --gold-text:#D4B95F;--gold-wash:rgba(198,168,76,.14);--mist:#1E2529;--danger:#E07A6F;--ok:#7FC39C;
  --header-bg:#08090A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header-bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.band{background:var(--header-bg);color:var(--header-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid rgba(198,168,76,.35)}
.band-in{max-width:1240px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:26px;line-height:1;letter-spacing:.01em;color:#fff;display:flex;flex-direction:column}
.mark small{font-family:var(--body);font-size:9.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.band-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#B9BEC1;border-left:1px solid #33393D;padding-left:16px}
.band-sp{flex:1}
.role{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid #3A4044;color:#D9DDDF;white-space:nowrap}
.role i{width:7px;height:7px;border-radius:50%;background:#8A9094}
.role.mgr{border-color:var(--gold);color:var(--gold)}
.role.mgr i{background:var(--gold)}

.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:22px}
.search{position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.grp h4{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.nav button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:8px 12px;border-radius:var(--r);border-left:2px solid transparent;color:var(--text)}
.nav button:hover{background:var(--gold-wash)}
.nav button[aria-current="page"]{border-left-color:var(--gold);background:var(--gold-wash);color:var(--gold-text);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .empty{color:var(--muted);font-size:13px;padding:4px 12px}
.addbtn{all:unset;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--gold-text);font-weight:600;padding:2px 4px;border-radius:4px}
.addbtn:hover{background:var(--gold-wash)}
.railnote{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

main{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
h1.title{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,42px);line-height:1.12;margin:6px 0 10px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.head>div:first-child{min-width:0;flex:1 1 320px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000;border-color:var(--gold)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#101315;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#101315;border-color:var(--gold)}}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toc{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.toc button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.toc button:hover{color:var(--gold-text);border-color:var(--gold)}

.sec{padding:26px 0;border-bottom:1px solid var(--line);scroll-margin-top:110px}
.sec:last-child{border-bottom:0}
.sec h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 10px;line-height:1.25;text-wrap:balance}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose strong{font-weight:700}
.prose h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.script{position:relative;margin:4px 0 14px;padding:14px 16px 14px 18px;background:var(--gold-wash);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0}
.script .lab{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-text);font-weight:700;margin-bottom:6px}
.script .lab button{all:unset;cursor:pointer;font-size:11.5px;letter-spacing:.04em;text-transform:none;color:var(--gold-text);padding:2px 6px;border-radius:4px}
.script .lab button:hover{background:var(--gold-wash)}
.script p{margin:0 0 6px;font-style:italic}
.tmpl{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold)}
.tmpl .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.shot{margin:6px 0 16px;max-width:100%}
.shot img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.shot figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.prose a{color:var(--gold-text);text-underline-offset:2px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:var(--r)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{background:var(--gold-wash);color:var(--gold-text);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tbl td:first-child{width:52%;font-weight:500}
.tbl td+td{font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:var(--surface)}
@media (max-width:560px){.tbl table{font-size:13.5px}.tbl th,.tbl td{padding:8px 10px}.tbl td:first-child{width:50%}}
.pending{color:var(--muted);font-style:italic;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;max-width:68ch}

.state{padding:48px 0;max-width:56ch}
.state h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 8px}
.state p{color:var(--muted)}

.results{display:flex;flex-direction:column;gap:2px;margin-top:18px}
.hit{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:14px 16px;border-radius:var(--r);border:1px solid transparent}
.hit:hover,.hit:focus-visible{background:var(--surface);border-color:var(--line)}
.hit .t{font-weight:600}
.hit .t span{color:var(--muted);font-weight:400}
.hit .s{font-size:13.5px;color:var(--muted);margin-top:2px}
mark{background:rgba(198,168,76,.35);color:inherit;border-radius:2px;padding:0 1px}

/* editor */
.ed{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.field label{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field textarea{min-height:150px;resize:vertical;line-height:1.55;font-size:14px}
.edsec{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.edsec .row{display:flex;gap:8px;align-items:center}
.edsec .row input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-weight:600}
.edsec textarea{width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);resize:vertical;line-height:1.55;font-size:14px}
.ic{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:var(--r);width:34px;height:34px;display:grid;place-items:center;flex:none}
.ic:hover{border-color:var(--gold)}
.ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.hint code{background:var(--gold-wash);padding:1px 5px;border-radius:3px;font-size:12px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:10px 14px;border:1px solid var(--danger);border-radius:var(--r);margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13.5px;border:1px solid var(--gold);z-index:20}

.mobnav{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:18px}
  .rail{position:static}
  .band-title{display:none}
  .rail .grp,.rail .railnote{display:none}
  .rail.open .grp{display:block}
  .mobnav{display:block}
}
@media (prefers-reduced-motion:no-preference){.sec,.state{animation:fade .25s ease both}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

</head>
<body>
<script>
try{window.__ADVISOR=(new URLSearchParams(location.search).get('advisor')||'').replace(/[^A-Za-z .\'-]/g,'').trim().slice(0,40)}catch(e){}
(function(){var DATA={"kb": [{"id": "process", "data": {"kind": "process", "order": 1, "sections": [{"body": "- Consultation with the doctor: **£250**\n- The £250 consultation fee is **redeemable against the cost of treatment** when the patient goes ahead.\n- **0% finance** is only available on treatments of **£1,000 and above**. Only mention it if the patient asks to pay in instalments. See the 0% finance option below.", "h": "Pricing at a glance"}, {"body": "1. **Before the visit:** the patient fills in the medical forms sent to them by email.\n2. **Arrival:** the patient arrives at the clinic and is offered a welcome drink.\n3. **Welcome:** our clinical team welcomes the patient and shows them a video about their treatment.\n4. **Consultation:** the patient goes in for their consultation with the doctor.", "h": "The consultation process"}, {"body": "Once the patient is ready to book:\n\n1. **Choose the day and time** that suits the patient.\n2. **Take the payment** (the £250 deposit).\n3. **After the payment is done, ask the patient for their postal code.**\n4. **Add the appointment on Zenoti:** https://drswclinics.zenoti.com/\n\nFor step 4, follow the **Zenoti Process** tab.", "h": "Booking a consultation"}, {"body": "### Context\nMost patients are reluctant to pay a deposit, so expect this on most calls. Never apologise for it.\n\n### The rule\nThe £250 secures the consultation on our system and is **redeemable against the cost of treatment**. Present it as the first part of the treatment, never as an extra fee. Say \"secure\", \"hold\" or \"reserve\", never \"fee\" or \"charge\".\n\n### Approved script (after the doctor review is set up)\n> I'm going to take your photos and show them to the doctor to assess them. Once I've confirmed your suitability I'll call you to let you know. To book your appointment on our system, it requires a £250 deposit to secure the consultation, and it comes off the cost of your treatment. Once I have your suitability confirmed I'll call you and help you with every step along the way.\n\n### Ways to frame it\n- **The head start:** \"Think of the £250 as your first payment towards your treatment. You're not paying for a consultation, you're paying towards your treatment.\"\n- **The split:** \"It's [total] in two parts: £250 now to lock in your doctor's time, and the rest on the day.\"\n- **The commitment:** \"The deposit is how we hold a dedicated slot with the doctor just for you, and the full £250 counts towards your treatment.\"\n\nThen stop talking and wait.\n\nAlways mention that we're **almost fully booked**. We're a very busy clinic, so it's always true, and it gives the patient a reason to act quickly:\n> Just a heads-up, we're almost fully booked, so once the doctor confirms your suitability I'll call you straight away to secure your place.", "h": "Deposit fee and how to pitch it"}, {"body": "### When to mention it\n**Never offer 0% finance in the script.** Only bring it up if the patient asks to pay in instalments.\n\n### How it works\n- The patient can pay in instalments over **3, 6, 9 or 12 months** with **0 interest**.\n- All they pay up front is the **£250 deposit**. The rest is paid in instalments.\n- Available on treatments of **£1,000 and above only**. Nothing less can be financed.\n\n### \"So what am I going to pay monthly?\"\nThe £250 deposit is paid up front and is **never included in the instalments**. Take the £250 off the treatment price, then divide the balance by the number of months the patient chooses.\n- Example: a £3,000 treatment → £2,750 balance over 12 months = about £229 a month.\n- Example: a £1,000 treatment → £750 balance over 12 months = £62.50 a month.\n\n### Booking tip\nIf the patient is interested in 0% finance, book them **early: 11am, 12pm or 1pm**, so the clinic team can finalise the finance for them on the same day.", "h": "0% finance option"}, {"body": "**Follow-through after every rebuttal:** answer simply, check \"Is that the only thing, or is there anything else?\", then ask for the next step: \"Can you reply with your photos today?\"\n\n**\"I want to talk to my husband / partner.\"**\n> Of course, that makes sense.\n> If it was just up to you, is this something you'd want to go ahead with?\n> What do you think their main question will be?\n> Would it help if I sent you the email with all our information, so you can show them?\n\n**\"I need to think about it.\"**\n> Of course, it's a big decision and I'd want to think about it too.\n> Usually when someone says that, it's one of three things: the treatment itself, the price, or the timing. Which one is it for you?\n> [Answer that one thing.]\n> Is that the only thing, or is there anything else?\n\n**\"I need to check and explore my options.\"**\n> That's smart, you should feel sure.\n> What matters most to you when you compare clinics?\n> When you compare, it's worth asking each clinic who does the treatment and to see their results.\n> Shall I send you our information now so you have something to compare against?\n\n**\"I don't live in London.\"**\n> That's no problem at all, a lot of our patients don't. People travel to us from the USA, Dubai and all over Europe, and you can have your consultation and your treatment on the same day, so it's one trip.\n**\"I need more time.\" / \"Maybe in a month or two.\"**\n> Sure, absolutely, take the time you need.\n> I just have one question: 30 days from now, what's going to change?\n> I ask because so many of our patients take their time, and once they've had the treatment, the only thing they tell us they regret is not doing it sooner.\n> So what's really holding you back right now? If there's a question I can answer, I'd love to help.\n\nPause after each line and let the patient answer.\n\n**\"It's not about the money.\"**\n> I completely understand, and I'm glad to hear that.\n> As long as we're on the same page that this is an investment in yourself, and it's absolutely worth it. When it comes to our face and our body, it's not something we shop around for a sale on, right?\n> Then let's go ahead and arrange your consultation. [Photo-first treatments: Can you reply with your photos today? Others: Which day works best for you, [day] or [day]?]\n\n**\"Can I get a discount?\"**\n> That's a great question, and I get it. You want the best result for the best price, and that's exactly what we want for you too.\n> Can I ask you something? Would you get on a plane if the airline's slogan was \"Fly with us, our pilots work for the lowest wages\"?\n> Probably not, right? When something really matters, you want the best person in charge, not the cheapest.\n> It's the same with your [face / body]. Our prices are set by the clinic, because you're in the hands of Dr SW and his team, and that's what gets you the result you're looking for.\n> Does that make sense?\n\nPause after each line. If this treatment has an ongoing offer on the Offers tab, share that offer exactly as written. Never invent a discount or criticise another clinic. Only mention 0% finance if the patient asks to pay in instalments, and only on treatments of £1,000 or more.\n\n**\"I've been disappointed by a clinic before.\"**\n> I'm really sorry, that must have been frustrating.\n> What happened, if you don't mind me asking?\n> That's exactly why our consultations are designed around you. The doctor looks at your concern, your history and what you want to achieve before anything goes ahead, so nothing is decided for you. [Photo-first treatments, add: And the doctor reviews your photos before anything is booked.]\n> What would you need to see from us to feel confident this time?\n\n**\"Why do I need a consultation? Can't I just book the treatment?\"**\n> I love that you're ready to go.\n> Every treatment is designed around the patient, so the doctor needs to confirm what's right for you first. That's how you get the result you want, not just a treatment.\n> And the £250 to secure it comes off your treatment, so it isn't an extra cost.\n> [Photo-first treatments: Can you reply with your photos today? Others: Which day works best for you, [day] or [day]?]", "h": "Approved rebuttals (all treatments)"}, {"body": "**This is not a must.** You don't have to mention refunds on every call. Only bring it up if the patient asks.\n\nWhen it does come up:\n- All refund requests are subject to an **eligibility review and approval**.\n- An approved refund can take **up to 28 working days** to process.\n- Contacting the clinic before the 28 working days have passed won't speed it up, so ask patients to allow the full period before chasing.\n\n> Refund requests go through an eligibility review. Once a request is approved, the refund can take up to 28 working days to process.", "h": "Refunds"}, {"body": "We have a variety of treatments, and each one is designed around the patient's needs. That is why every patient has a consultation with the doctor before going ahead.\n\nAlways say **rejuvenation**, never \"renewal\".", "h": "Not one treatment fits all"}, {"body": "When a patient raises a concern:\n1. Acknowledge it respectfully. Don't argue or dismiss it.\n2. Ask one brief question if you need to understand the concern.\n3. Respond directly using relevant, verified information.\n4. Explain options or trade-offs honestly, including when the treatment may not be a fit.\n5. Ask whether that addresses the concern, then suggest a reasonable next step if appropriate.\n\nBe ready for concerns about **price, timing, trust, competitors, who makes the decision, risk, and whether the treatment is necessary**. Tailor each answer to what the patient actually said. No canned rebuttals.", "h": "Handling objections"}, {"body": "- Learn what the patient needs before recommending anything.\n- Keep replies clear, natural and concise. Ask one question at a time.\n- Don't pressure, shame, mislead or create false urgency.\n- Never invent features, prices, results, policies, testimonials or guarantees. If you don't know, say so and offer to find out.\n- Recommend a treatment only when it fits the patient's needs. If it doesn't, say so and explain why.\n- If the patient clearly says no, acknowledge it and end politely.\n- If the patient asks for a person, arrange the handoff.", "h": "Conversation rules"}], "title": "Clinic Process at a Glance", "updatedAt": 1793213830253, "updatedBy": null}}, {"id": "zenoti", "data": {"kind": "process", "title": "Zenoti Process", "order": 2, "updatedAt": 1793032814176, "updatedBy": null, "sections": [{"h": "Step 1: Open Zenoti", "body": "Go to https://drswclinics.zenoti.com/"}, {"h": "Step 2: Log in to Zenoti", "body": "Log in with your own Zenoti username and password. Never share your login with anyone."}, {"h": "Step 3: Go to Appointments", "body": "From the Admin Dashboard, click the **Appointment** icon (calendar) in the left menu.\n\n![Appointment icon in the left menu](img:z3)"}, {"h": "Step 4: Choose the day", "body": "Click the date at the top and pick the day from the calendar.\n\n![Choosing the day from the calendar](img:z4)"}, {"h": "Step 5: Click the time slot", "body": "Left-click on the empty slot at the chosen time, in the doctor's column.\n\n![Left-click on the chosen time slot](img:z5)"}, {"h": "Step 6: Choose New Appointment", "body": "![Choose New Appointment](img:z6)"}, {"h": "Step 7: Fill in the patient information", "body": "Fill in the required fields: mobile, first name, last name, email and gender.\n\n![Patient information form](img:z7)"}, {"h": "Step 8: Add the service", "body": "Select the consultation service the patient needs, for example **Plexr Consultation** or **O Concept for Him Consultation**, then click **Add Service**.\n\n**Make sure the consultation price is £250.**\n\n![Adding the service](img:z8)"}, {"h": "Step 9: Add a note", "body": "Click **Add Note** and write your initials and the medical screening.\n\nExample: Olivia Clark → **O.C**, followed by the screening answers.\n\n![Appointment Notes box](img:z9)"}, {"h": "Step 10: Save the note and the appointment", "body": "Click **OK** to save the note, then click **Save** to save the appointment.\n\n![Add Note, Take Payment and Save buttons](img:z10a)\n\n![Save button](img:z10b)"}, {"h": "Step 11: Go to Today", "body": "To add the payment, click **Today**.\n\n![Today button](img:z11)"}, {"h": "Step 12: Click POS", "body": "Click **POS** at the top of the screen.\n\n![POS button](img:z12)"}, {"h": "Step 13: Add the patient details", "body": "Fill in the patient details: mobile, first name, last name, gender and email.\n\n![Patient details on the POS screen](img:z13)"}, {"h": "Step 14: Add the service", "body": "Open the **Service** tab and add the service.\n\n![Adding the service](img:z14)"}, {"h": "Step 15: Select the doctor and click Add", "body": "Choose the doctor from **Select Employee**, then click **Add**.\n\n![Select the doctor and click Add](img:z15)"}, {"h": "Step 16: Choose the payment method", "body": "Go to **Payment Data** and select **Stripe**, **Bank Transfer** or **Debit**, depending on how the patient paid.\n\n![Payment Data dropdown](img:z16)"}, {"h": "Step 17: Click Add Payment", "body": "Click **Add Payment**.\n\n![Add Payment button](img:z17)"}, {"h": "Step 18: Add the address and close the invoice", "body": "Fill in the patient's address, then click **Close Invoice**.\n\n![Close Invoice button](img:z18)"}, {"h": "Step 19: Click Close Invoice again", "body": "A **Select Employee** box will pop up. Click **Close Invoice** again to finish.\n\n![Select Employee pop-up with Close Invoice](img:z19)"}]}}, {"id": "prices", "data": {"kind": "process", "order": 3, "sections": [{"body": "Prices from the clinic's **Price List 2026** (29.07.2026). The £250 consultation is redeemable against the cost of treatment.\n\n| Treatment | Price |\n|---|---|\n| All new consultations | £250 |\n| Aesthetic consultation (Botox, fillers…) | Free |", "h": "Consultations"}, {"body": "| Treatment | Price |\n|---|---|\n| P-Shot s nera Hair | £1,500 |\n| G-Cell Stem Cell for hair loss | £2,999 |\n| Hair LED Cap (one cap) | £1,000 |", "h": "Hair Treatments"}, {"body": "| Treatment | Price |\n|---|---|\n| Botox | One area: £150 (with Dr SW £200)<br>Two areas: £210 (with Dr SW £350)<br>Three areas: £275 (with Dr SW £450) |\n| Non-surgical blepharoplasty, upper or lower (with concealer) | £1,500 (with Dr SW £2,000) |\n| Non-surgical blepharoplasty, upper and lower | £2,500 (with Dr SW £3,500) |\n| Non-surgical rhinoplasty | £600 |\n| Dermal fillers | £420 per 1ml |\n| Ellansé dermal fillers | £500 per 1ml |\n| Tear trough | £600 |\n| Nefertiti Lift | £600 |\n| Profhilo (skin booster) | £350<br>£1,000 course of 3 |\n| Skin boosters HA non-cross-linked (TSK) | £350<br>£900 course of 3 |\n| Threads | From £1,500 |\n| Plexr for neck sagging | £1,500 |\n| Plexr smokers' line | £750 (lines on top of upper eyelid) |\n| Oxygentix for Plexr | £70 |\n| Morpheus8 | £750, one area<br>£1,900 for 3 areas |\n| Laser Vydence Erbium, ProDeep mode | £1,500 per session<br>£3,500 course of 3 with home care |\n| Laser Vydence Erbium, dual mode (ProDeep + dual) | £2,000 per session<br>£4,900 course of 3 with home care |\n| EXION Microneedling RF | £500, one session<br>£2,500 for 8 sessions (weekly) |\n| EXION Clear RF | £1,000 per session<br>£2,500 course of 3 |\n| Exion Radiofrequency Face, one area | £500 per session<br>£2,500 course of 8 |\n| Vampire Face Lift (PRP) | £1,000<br>£2,500 course of 3 sessions (monthly) |\n| Red Carpet Face (VFL (PRP) + AQ growth factors + cross-linked HA + mask + LED mask session) | £2,000 |\n| AQ Recovery + AQ Active + Dermapen (one session, AQ face recovery + active) | £750<br>£1,900 course of 3 |\n| Mesotherapy | £375, one area<br>£900 course of 3 |\n| Meso Gun session | £400<br>£1,000 course of 3 |\n| Carboxytherapy | £175<br>£1,500 course of 10 |\n| Opera LED Mask session | £175 |\n| Cosmelan | £1,200 |\n| Dermamelan treatment | £1,500 |\n| Mole removal | From £500 |\n| Scar removal with steroid injections | From £300<br>£750 course of 3 sessions (monthly) |", "h": "Face Treatments"}, {"body": "| Treatment | Price |\n|---|---|\n| Upper blepharoplasty | £3,490 |\n| Lower blepharoplasty | £4,200 |\n| Fat transfer, full face | £6,900 |\n| Labia fat transfer | From £4,000 |\n| Vaginal tightening with fat transfer | £4,000 |\n| Fat transfer to labia + vagina | £6,000 |\n| Penis fat transfer | £5,500 |\n| Ligament release | £4,500 |\n| Liposuction | From £3,000 |", "h": "Surgical Treatments"}, {"body": "| Treatment | Price |\n|---|---|\n| Ozone therapy, 10 passes | £750 per session<br>£5,500 course of 10 sessions |\n| Ozone for ED | £275 per session<br>£2,400 course of 10 |\n| Ozone for prostatic enlargement | £500 per session<br>£3,500 course of 10 |\n| Vaginal ozone insufflation | £250 per session<br>£1,900 course of 10 |\n| Rectal ozone insufflation | £250 per session<br>£1,900 course of 10 |\n| Ozone vaginal and rectal insufflation | £350 per session<br>£2,999 course of 10 |\n| NAD+ Pen | £350 |", "h": "Longevity"}, {"body": "| Treatment | Price |\n|---|---|\n| Tricotest | £380 |\n| Acne test | £380 |\n| Telotest | £380 |\n| Nutritest | £480 |\n| Sports test | £480 |", "h": "Genetic Testing"}, {"body": "| Treatment | Price |\n|---|---|\n| Infrared | £250 per session<br>£1,500 course of 10 (3 sessions per week)<br>£2,200 course of 20 (3 sessions per week) |", "h": "Infrared"}], "title": "Price List", "updatedAt": 1793113251011, "updatedBy": null}}, {"id": "offers", "data": {"kind": "process", "title": "Offers", "order": 4, "updatedAt": 1793035083286, "updatedBy": null, "sections": [{"h": "Ongoing offers", "body": "These offers are running now.\n\n| Offer | Offer price | Normal price |\n|---|---|---|\n| Non-surgical blepharoplasty with Azi | **£999 per area** | £1,500 per area |\n| Polynucleotide, 1 session | **£199** | £500 |\n| Polynucleotide, 3 sessions | **£550** | — |\n| Vampire Face Lift, 1 session | **£600** | £1,000 |\n| Vampire Face Lift, 3 sessions + Dermapen | **£1,500** | £2,500 |\n| Hair: course of 3 PRP sessions + Dermapen + infrared therapy | **£950** | £2,000 |\n| Stem Cell Hair Restoration | **£1,950**<br>+ 1 complimentary PRP session | £6,000 |"}, {"h": "Expired offers", "body": "These offers have ended.\n\n| Offer | Offer price |\n|---|---|\n| Penis enlargement | £999 for 10ml |\n| Non-surgical blepharoplasty | £750 per area |\n| Non-surgical blepharoplasty | £900 per area |\n| Non-surgical blepharoplasty | £999 for two areas |"}]}}, {"id": "blepharoplasty", "data": {"kind": "treatment", "order": 10, "sections": [{"body": "- **Treatment:** non-surgical blepharoplasty, eyelid and eye-area skin rejuvenation with the **Plexr** machine.\n- **Technology:** plasma frequency.\n- **How it works:** local numbing cream goes on the area of concern. We go over the area with the Plexr machine, which takes the skin from a solid state straight to a gas state. This forms small scabs, and as they heal the skin rejuvenates itself using the patient's own anatomy.\n- **Frequency:** one-time treatment.\n- **Healing:** 10 to 14 days. It's a skin rejuvenation process that helps the body tighten the skin naturally.\n- **Authority:** Dr SW introduced the Plexr machine to Europe.\n- **Entry step:** patient emails photos, the doctor reviews them and confirms suitability.\n- **Deposit:** £250 secures the consultation and is redeemable against the treatment.\n- **Finance:** 0% over 3, 6, 9 or 12 months, only if the total is £1,000 or more. Don't offer it; only mention it if the patient asks to pay in instalments.\n- **Price:** **£1,500 per area** with Azi, or **£2,000 per area** with Dr Sherif.\n\n### Not one treatment fits all\nEvery treatment is designed around the patient's needs. That is why the patient has a consultation with the doctor before anything goes ahead.", "h": "At a glance"}, {"body": "- **Always pitch the treatment.** Even if the patient says they don't need any info or have no questions. It is the only sale point we have.\n- **Explain first, screen second.** Never ask a screening question until the treatment has been explained.\n- **Be confident.** No \"unfortunately\", no \"I'm afraid\", no \"we don't have WhatsApp\". Say what we do, never what we don't.\n- **One path, no options.** Email, photos, doctor confirms suitability, deposit, booking.\n- **Use the patient's words.** Say \"your upper lids\" or \"your lower eyelids\", never just \"the area\".\n- **Always say rejuvenation**, never \"renewal\".\n- **Don't over-sell.** If the patient has done their research, confirm what they know and move forward.\n- **Never promise results and never diagnose.** The doctor decides suitability.", "h": "Golden rules"}, {"body": "1. **No surgery.** No scalpel and no operating theatre.\n2. **Their own anatomy.** The skin rejuvenates itself.\n3. **One-time treatment.** No course of sessions to commit to.\n4. **Comfortable.** Local numbing cream is applied first.\n5. **Doctor-led.** Dr SW introduced the Plexr machine to Europe.\n6. **Proof.** Before and after pictures are in the email we send.\n7. **Personalised.** The doctor reviews the patient's photos first, and each treatment is designed for the patient's needs.", "h": "Selling points"}, {"body": "### Step 1: Open\n> Hi [name], it's [your name] from Dr SW Clinics. Thanks for your enquiry about our non-surgical blepharoplasty. Tell me, what's concerning you most about your [upper eyelids / lower eyelids]?\n\nListen, then label what you heard and narrow it down:\n> It sounds like your [upper eyelids / lower eyelids] are really getting to you, and that is exactly the kind of concern we treat. Is it excess upper eyelid skin, under-eye bags, fine lines or wrinkles, looking tired even when well rested, or a combination of those?\n\nOnly offer the options that match the area the patient mentioned:\n- **Excess upper eyelid skin:** upper eyelids only.\n- **Under-eye bags:** lower eyelids only.\n- **Fine lines or wrinkles:** upper and lower.\n- **Looking tired even when well rested:** upper and lower.\n- **A combination of those:** upper and lower.\n\nThen ask, and listen (this shows what staying the same is costing them):\n> Can I ask, how long has [their concern] been bothering you?\n> And how does it make you feel day to day, when you look in the mirror or see yourself in photos?\n> Imagine a year from now, still feeling like that. Is that something you'd want?\n> The good news is it doesn't have to stay that way. Let me tell you how we can help.\n\nUse the patient's own words and keep it warm: the aim is to show what they stop living with, never to make them feel bad about how they look.\n\n### Step 2: The pitch (always, no skipping)\n> Let me explain how it works so you know exactly what to expect. First, we apply a local numbing cream to your [area of concern], so you're comfortable. Then we use the Plexr machine, which works with plasma frequency. We go over the area with the machine and it takes the skin from a solid state straight to a gas state. That forms small scabs, and while they heal your skin rejuvenates itself, using your own anatomy. And it's a one-time treatment, so there's no course of sessions and no surgery. Something that reassures a lot of our patients: Dr SW is the doctor who introduced the Plexr machine to Europe, so you're in very experienced hands.\n\n**If the patient says \"I don't need any info\":**\n> Perfect, you're clearly well informed. I'll just take you through it quickly so we're on the same page. We numb your [area] with a local cream, then go over it with the Plexr plasma machine, which takes the skin from solid to gas. That forms small scabs, your skin rejuvenates itself, and it's a one-time treatment. And Dr SW is the doctor who introduced the Plexr machine to Europe, so you're in very experienced hands. Does that sound like what you were looking for?\n\n**If the patient has done their research** (one light line about Dr SW, don't over-sell):\n> You've clearly done your homework, so I won't repeat what you already know. You've probably seen that Dr SW is the one who brought Plexr to Europe, so you're in good hands. The key thing is that the doctor looks at your own photos first and confirms this is right for your [area].\n\n### Step 3: Screening questions\nSee the Screening questions section.\n\n### Step 4: The email and photos\n> Here's what happens next. I'm sending you an email right now with all our information, including before and after pictures. Reply to that email with photos of your [area], and I'll show them to the doctor to confirm you're suitable for the treatment, or recommend the treatment that suits you best.\n\nPhoto guide: natural light, no make-up, eyes open looking straight at the camera, one from the front, one from each side, and a close-up of the area of concern.\n\nIf they ask to send photos another way:\n> Email is the quickest way to get this to the doctor, because everything sits together on your file. As soon as you see my email, just hit reply with your photos.\n\n### Step 5: Expectations and the deposit\n> I'm going to take your photos and show them to the doctor to assess them. Just a heads-up, we're almost fully booked, so once I've confirmed your suitability I'll call you to let you know. To book your appointment on our system, it requires a £250 deposit to secure the consultation. Once I have your suitability confirmed I'll call you and help you with every step along the way.\n\nAlways mention that we're almost fully booked. We're a very busy clinic, so it's true and it gives the patient a reason to send their photos quickly.", "h": "Call flow and approved scripts"}, {"body": "Only start after the pitch:\n> Now that you know how it works, I just need to ask a few quick questions so the doctor can assess you properly.\n\nAsk one at a time, write every answer down, stay calm, and never tell the patient they are or aren't suitable. After any \"yes\": \"Thank you, I'll pass that on to the doctor.\"\n\n1. Can I take your full name, please?\n2. What is your date of birth, please?\n3. Do you smoke or drink alcohol? If so, how frequently?\n4. Do you have any medical conditions or ongoing health issues that we should be aware of?\n5. Are you currently taking any medications or regular treatments?\n6. Do you have any allergies or previous reactions to medications or treatments?\n7. What concerns you most about your eye area at the moment?\n8. Have you noticed any puffiness, loose skin, heaviness, or tiredness around your eyelids or under-eye area?\n9. How long have you been noticing these changes?\n10. Have you had any previous treatments or procedures around your eyes? If so, when and what treatment did you have?\n11. Do you take blood thinners, or have any bleeding or clotting problems?\n12. Do you have diabetes or an autoimmune condition, or do cuts and scrapes heal slowly for you?", "h": "Screening questions"}, {"body": "**Follow-through after every rebuttal:** (1) answer simply, (2) check: \"Is that the only thing, or is there anything else?\", (3) ask for the next step: \"Perfect, I'm sending that email now. Can you reply with your photos today?\"\n\n**\"I want to talk to my husband.\"**\n> Of course, that makes sense.\n> If it was just up to you, is this something you'd want to go ahead with?\n> What do you think his main question will be?\n> Would it help if I sent you the email with our before and afters, so you can show him?\n\n**\"I need to think about it.\"**\n> Of course, it's a big decision and I'd want to think about it too.\n> Usually when someone says that, it's one of three things: the treatment itself, the price, or the timing. Which one is it for you?\n> [Answer that one thing.]\n> Is that the only thing, or is there anything else?\n\n**\"I need to check and explore my options.\"**\n> That's smart, you should feel sure.\n> What matters most to you when you compare clinics?\n> When you compare, it's worth asking each clinic who does the treatment and to see their before and afters.\n> Shall I send you ours now so you have something to compare against?\n\n**\"I don't want to pay a deposit.\"**\n> It sounds like you want to be sure before you put money down, which makes complete sense.\n> The £250 isn't an extra charge. It comes straight off the cost of your treatment, so you're not spending anything you wouldn't spend on the treatment anyway.\n> And you only pay it once the doctor has looked at your photos and confirmed you're suitable, so you're never paying for something that isn't right for you.\n> Does that change how it feels for you?\n\nPause after each line and let the patient answer.\n\n**\"It's too expensive.\"**\n> That's fair, it is an investment.\n> When you say it's too expensive, is that compared with something you've seen, or with what you had in mind to spend?\n> What would you need to see or hear to feel confident this treatment is worth it for you?\n> When we spoke, you told me [their concern] is really bothering you and you want it done properly. Is that still how you feel?\n> Based on everything you've told me, which feels right for you: getting the doctor's opinion on your photos now, or leaving [their concern] as it is for now?\n\nAfter \"That's fair, it is an investment\", stop and wait; don't fill the silence. Pause after each line and let the patient answer. Never defend the price or offer a discount. Don't offer 0% finance. Only mention it if the patient asks to pay in instalments, and only when the total is £1,000 or more.\n\n**\"I've seen it cheaper elsewhere.\"**\n> You probably can.\n> When you say cheaper, are you talking about getting the same treatment and the same result, just at a lower price?\n> What have you seen from the other clinic that gives you confidence you'll get the same result?\n> When we spoke, you told me [their concern] is really bothering you and you want it done properly. Is that still how you feel?\n> Which option gives you the most confidence that you'll get the result you're looking for?\n\nPause after each line and let the patient answer. Never criticise another clinic.\n\nAfter \"You probably can.\", stop talking and let the patient fill the silence. Optional, only if the patient says the other clinic offers the same treatment:\n> And that's fair. The way I see it, the most expensive treatment isn't always the one with the highest price. It's the one you end up having to do twice. Which option gives you the most confidence you'll get it right the first time?\n\n**\"I need more time.\" / \"Maybe in a month or two.\"**\n> Sure, absolutely, take the time you need.\n> I just have one question: 30 days from now, what's going to change?\n> I ask because so many of our patients take their time, and once they've had the treatment, the only thing they tell us they regret is not doing it sooner.\n> So what's really holding you back right now? If there's a question I can answer, I'd love to help.\n\nPause after each line and let the patient answer.\n\n**\"It's not about the money.\"**\n> I completely understand, and I'm glad to hear that.\n> As long as we're on the same page that this is an investment in yourself, and it's absolutely worth it. When it comes to our face and our body, it's not something we shop around for a sale on, right?\n> Then let's go ahead and arrange your consultation. Can you reply with your photos today, so the doctor can review them first?\n\n**\"Can I get a discount?\"**\n> That's a great question, and I get it. You want the best result for the best price, and that's exactly what we want for you too.\n> Can I ask you something? Would you get on a plane if the airline's slogan was \"Fly with us, our pilots work for the lowest wages\"?\n> Probably not, right? When something really matters, you want the best person in charge, not the cheapest.\n> It's the same with your face. Our prices are set by the clinic, because you're in the hands of Dr SW and his team, and that's what gets you the result you're looking for.\n> Does that make sense?\n\nPause after each line. If this treatment has an ongoing offer on the Offers tab, share that offer exactly as written. Never invent a discount or criticise another clinic. Only mention 0% finance if the patient asks to pay in instalments.\n\n**\"I've been disappointed by a clinic before.\"**\n> I'm really sorry, that must have been frustrating.\n> What happened, if you don't mind me asking?\n> That's exactly why our consultations are designed around you. The doctor looks at your concern, your history and what you want to achieve before anything goes ahead, so nothing is decided for you.\n> And the doctor reviews your photos before anything is booked.\n> What would you need to see from us to feel confident this time?\n\n**\"Why do I need a consultation? Can't I just book the treatment?\"**\n> I love that you're ready to go.\n> Every treatment is designed around the patient, so the doctor needs to confirm what's right for you first. That's how you get the result you want, not just a treatment.\n> And the £250 to secure it comes off your treatment, so it isn't an extra cost.\n> Can you reply with your photos today?\n\n**\"Does it hurt?\"**\n> It sounds like comfort matters to you, and that's exactly why we apply a local numbing cream to your [area] before we start. And we also have the option to inject a numbing substance if you feel you can't tolerate the discomfort.\n\n**\"How long does it last? Is it permanent?\"**\n> It's a one-time treatment, so you don't need a course of sessions. Everyone's skin continues to age naturally, and the doctor will go through exactly what to expect for you.\n\n**\"Just send me the details and I'll get back to you.\"**\n> Of course, I'm sending it right now.\n> So you get the most out of it, which part matters most to you: the before and afters, or what the treatment involves?\n> And when you reply with your photos, would today or tomorrow be easier?\n\n**\"I'm worried about the scabs and healing.\"**\n> It sounds like you want to know what healing looks like, which is smart. Healing takes 10 to 14 days. The scabs are part of the process: it's a skin rejuvenation process that helps your body tighten the skin naturally, and the doctor will take you through the aftercare in detail.", "h": "Rebuttals"}, {"body": "Copy, fill in the [brackets], and send.\n\n### SMS: no answer (1st attempt)\n!> Hi [Patient Name],\n!> It's [Patient Advisor Name] from Dr SW Clinics.\n!> I was just reviewing your enquiry regarding the eye area treatment and wanted to quickly introduce myself.\n!> Just so I can point you in the right direction, would you say your main concern is:\n!> - excess upper eyelid skin,\n!> - under-eye bags,\n!> - fine lines/wrinkles,\n!> - looking tired even when well rested,\n!> - or a combination of those?\n!>\n!> Best,\n!> [Patient Advisor Name]\n\n### SMS: 1–2 days after sending the treatment info email\n!> Hi [Patient Name], hope you're doing well. Just checking in to see if you had a chance to look over the information I sent yesterday about Non-Surgical Blepharoplasty.\n!> If any questions came up, or you'd like to talk through what you're hoping to address, just reply here. I'm happy to help, no rush at all.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: missed follow-up call\n!> Hi [Patient Name], looks like we missed each other on the phone just now. No worries at all. Is there a better time for me to call, or would you prefer to chat by text? I'm happy to help with any questions about the treatment.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: Non-Surgical Blepharoplasty in a nutshell\n!> Hi [Patient Name],\n!> Non-surgical blepharoplasty uses plasma energy to rejuvenate the skin around your eyes. It helps your skin tighten naturally, using your body's own healing process. It's a one-time treatment, so you don't need to repeat it every month or every year. Your skin will keep ageing naturally over time, and how that shows is different for everyone. The doctor will go through exactly what to expect for you at your consultation.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: treatment info and testimonials\n!> Hi [Patient Name],\n!>\n!> Thanks for your interest in Non-Surgical Blepharoplasty at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> Our treatment page explains how it works and what to expect:\n!> https://drswclinics.com/treatment/the-non-surgical-blepharoplasty/\n!> You can also hear from patients who've shared their experiences:\n!> https://www.youtube.com/watch?v=G_c6WIvdc5I\n!> https://www.youtube.com/watch?v=oXrtq7Rfx-Y\n!> https://www.youtube.com/watch?v=aw88sUFhkqI\n!> A doctor can assess whether the treatment may be suitable for you and talk through expected results and recovery.\n!>\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: did not dial (DND)\n!> Hi [Patient Name],\n!> Thanks for your interest in Non-Surgical Blepharoplasty at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> Our treatment page explains how it works and what to expect:\n!> https://drswclinics.com/treatment/the-non-surgical-blepharoplasty/\n!> You can also hear from patients who've shared their experiences:\n!> https://www.youtube.com/watch?v=G_c6WIvdc5I\n!> https://www.youtube.com/watch?v=oXrtq7Rfx-Y\n!> https://www.youtube.com/watch?v=aw88sUFhkqI\n!> A doctor can assess whether the treatment may be suitable for you and talk through expected results and recovery. What would you most like to address: upper eyelid skin, under-eye bags, or lines around the eyes?\n!> Reply with your main concern and a convenient time to speak, and I'll help arrange the next step.\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: request the photos\n!> Subject: Photos for your Non-Surgical Blepharoplasty assessment\n!>\n!> Hi [Patient Name],\n!> To help our doctor review your concerns and advise on the next steps, could you please reply to this email with a few recent photos of your eye area?\n!> If you're comfortable, please include:\n!> - A straight-on photo looking at the camera, with your eyes open\n!> - A photo turned slightly to the left\n!> - A photo turned slightly to the right\n!>\n!> Please use clear, natural lighting, keep your face relaxed, and avoid makeup, filters or sunglasses if possible.\n!> The doctor will use the photos for an initial review. They won't confirm suitability on their own; a full assessment and consultation may still be needed. Please only send photos you're comfortable sharing. If you'd prefer not to send them by email, let me know and we can discuss arranging a consultation.\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: phone number not working\n!> Subject: Quick question about your enquiry at Dr SW Clinics\n!>\n!> Hi [Patient Name],\n!>\n!> Thank you for your enquiry about Non-Surgical Blepharoplasty at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd love to help you with any questions.\n!>\n!> I tried to call you, but I couldn't get through on the number we have on file. It may have been entered incorrectly.\n!>\n!> Could you please reply with the best number to reach you, including the country code? It would also help to know a good day and time to call.\n!>\n!> If you'd rather chat by email, that's absolutely fine too. Just reply here with any questions.\n!>\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics", "h": "Messages and emails"}, {"body": "**What exactly is the treatment?** \"It's a non-surgical blepharoplasty. We use the Plexr machine, which works with plasma frequency, to rejuvenate the skin on your [area] without surgery.\"\n\n**How does it work?** \"We numb your [area] with a local cream, then go over it with the Plexr machine. The plasma takes the skin from a solid state straight to a gas state, which forms small scabs. As they heal, your skin rejuvenates itself using your own anatomy.\"\n\n**Is it surgery?** \"No, it's non-surgical.\"\n\n**How many sessions will I need?** \"It's a one-time treatment.\"\n\n**What are the scabs?** \"They're part of the process. As they heal, your skin rejuvenates itself.\"\n\n**What is the healing time?** \"Healing takes 10 to 14 days. It's a skin rejuvenation process, and that helps your body tighten the skin naturally.\"\n\n**Am I suitable?** \"That's exactly why the doctor reviews your photos first. Every treatment is designed around your needs. Reply to my email with your photos and the doctor will confirm.\"\n\n**Who is the doctor?** \"Dr SW is the doctor who introduced the Plexr machine to Europe.\"\n\n**How much does it cost?** \"It's £1,500 per area with Azi, or £2,000 per area with Dr Sherif. The £250 deposit comes off that.\"\n\n**Can I pay in instalments?** \"Yes, we offer 0% finance over 3, 6, 9 or 12 months, with just the £250 deposit up front.\" (Only when the patient asks.)\n\n**Why do I need to pay a deposit?** \"Our booking system requires a £250 deposit to secure your consultation, and it's redeemable against your treatment.\"\n\n**Can I see before and after photos?** \"Absolutely, they're in the email I'm sending you now.\"\n\n**Can I book today?** \"Once the doctor confirms your suitability from your photos, I'll call you and we'll book you in.\"", "h": "FAQs"}, {"body": "- \"Unfortunately…\" or \"I'm afraid…\"\n- \"We don't have WhatsApp\" or any other limitation.\n- \"Renewal\". Always say **rejuvenation**.\n- \"Guaranteed\", \"permanent\", \"risk-free\", \"you'll look 10 years younger\".\n- Anything that diagnoses, or tells a patient they are or aren't suitable.\n- Other treatments or options before the doctor has reviewed the photos.\n- A screening question or the deposit before the treatment has been explained.\n- Finance on anything under £1,000.\n- 0% finance before the patient asks to pay in instalments.\n- Anything negative about another clinic.", "h": "Never say"}], "title": "Non-Surgical Blepharoplasty (Plexr)", "updatedAt": 1793213830253, "updatedBy": null}}, {"id": "rhinoplasty", "data": {"kind": "treatment", "order": 20, "sections": [{"body": "- **Treatment:** non-surgical rhinoplasty (often called a \"liquid nose job\").\n- **Product:** hyaluronic acid dermal filler.\n- **What it does:** refines the nose's profile and, where suitable, softens the appearance of bumps or uneven contours.\n- **Time:** around 20–25 minutes.\n- **Comfort:** local anaesthetic may be used to help reduce discomfort.\n- **Results:** immediate, and typically last 12–15 months depending on the filler. They vary by individual.\n- **Price:** **£600**.\n- **Deposit:** £250 secures the consultation and is redeemed against the £600, so the balance on the day is **£350**.\n- **Finance:** not available. 0% finance starts at £1,000, so never offer it for this treatment.\n- **Same day:** consultation and treatment can be done on the same day.\n\n### Not one treatment fits all\nEvery treatment is designed around the patient's needs. That is why the patient has a consultation with the doctor before anything goes ahead.", "h": "At a glance"}, {"body": "- **Always pitch the treatment**, even if the patient says they don't need any info.\n- **Explain first, screen second.**\n- **Be confident.** No \"unfortunately\", no \"I'm afraid\".\n- **One path, no options.** Email, photos, doctor confirms suitability, deposit, booking.\n- **Use the patient's words.** \"The bump on your bridge\", \"your profile\", never just \"the area\".\n- **The £250 is part of the £600, never an extra.**\n- **Don't over-sell** to a patient who has done their research.\n- **Never promise results and never diagnose.** The doctor decides suitability.\n- **Temporary results, swelling and bruising are not part of the pitch.** If the patient asks, answer fully and honestly using the rebuttals.", "h": "Golden rules"}, {"body": "1. **No surgery.** No scalpel, no operating theatre, no general anaesthetic.\n2. **Quick.** Around 20–25 minutes, with immediate results, and consultation and treatment can be on the same day.\n3. **Comfortable.** Local anaesthetic may be used to help reduce discomfort.\n4. **Refines, doesn't replace.** Smooths the profile and softens the look of bumps or uneven contours, where suitable.\n5. **Simple.** No surgery and no recovery from an operation, just a short treatment with the doctor.\n6. **Doctor-led.** The doctor reviews the patient's photos first. Patients travel to us from the USA, Dubai and all over Europe.\n7. **Proof.** Before and after pictures are in the email we send.\n8. **Clear price.** £600 in total, and the £250 deposit comes off it.", "h": "Selling points"}, {"body": "### Step 1: Open\n> Hi [name], it's [your name] from Dr SW Clinics. Thanks for your enquiry about our non-surgical rhinoplasty. Tell me, what's bothering you most about your nose: is it a bump on the bridge, the profile from the side, or something feeling uneven?\n\nListen, then label:\n> It sounds like [the bump on your bridge / your side profile] is really getting to you, and that is exactly the kind of concern this treatment is designed for.\n\nThen ask, and listen (this shows what staying the same is costing them):\n> Can I ask, how long has [their concern] been bothering you?\n> And how does it make you feel day to day, when you look in the mirror or see yourself in photos?\n> Imagine a year from now, still feeling like that. Is that something you'd want?\n> The good news is it doesn't have to stay that way. Let me tell you how we can help.\n\nUse the patient's own words and keep it warm: the aim is to show what they stop living with, never to make them feel bad about how they look.\n\n### Step 2: The pitch (always, no skipping)\n> Let me tell you why patients who feel exactly like you do about [the bump on your bridge] choose this treatment. With no surgery and no operating theatre, the doctor uses a hyaluronic acid dermal filler to refine your profile and, where it's suitable, soften the look of [that bump / that uneven line]. The treatment itself takes around 20 to 25 minutes, a local anaesthetic may be used to keep you comfortable, and the results are immediate, so you see the difference before you leave. So instead of months thinking about surgery, you could be looking at your profile in a different way in under half an hour of treatment. Picture seeing a side-on photo of yourself and not noticing [the bump] first. And something that reassures a lot of our patients: people travel to see Dr SW from the USA, Dubai and all over Europe, and many of the patients we see have had nose filler before and come to us to get it looking the way they always wanted, so the doctor knows exactly what makes the difference between a good result and a great one. Is that the kind of change you've been hoping for?\n\n**If the patient says \"I don't need any info\":**\n> Perfect, you clearly know what you want, so I'll keep it to 20 seconds. No surgery: the doctor uses hyaluronic acid filler to refine your profile and soften [your bump], it takes around 20 to 25 minutes, and a local anaesthetic may be used so you're comfortable. Most people are surprised how simple it is. Does that sound like what you were looking for?\n\n**If the patient has done their research:**\n> You've clearly done your homework, so I won't repeat what you already know. The key thing is that the doctor looks at your own photos first and confirms this is right for your nose.\n\n### Step 3: Screening questions\nSee the Screening questions section.\n\n### Step 4: The email and photos\n> Here's what happens next. I'm sending you an email right now with all our information, including before and after pictures. Reply to that email with photos of your nose, and I'll show them to the doctor to confirm you're suitable for the treatment, or recommend the treatment that suits you best.\n\nPhoto guide: natural light, no make-up, hair back, face relaxed. One from the front, one full side profile from each side, and one from slightly below (chin up).\n\n### Step 5: Expectations and the deposit\n> I'm going to show your photos to the doctor. Just a heads-up, we're almost fully booked, so the moment your suitability is confirmed I'll call you to secure your place. The treatment is £600 in total. To hold your place on our system, you secure it with £250, and that isn't an extra cost: it comes straight off your £600. So on the day it's just £350, and your consultation with the doctor is already paid for inside that.\n\nThree ways to frame the deposit:\n- **The head start:** \"Think of the £250 as your first payment on your new profile. You're not paying for a consultation, you're paying towards your treatment.\"\n- **The split:** \"It's £600 in two parts: £250 now to lock in your doctor's time, £350 on the day.\"\n- **The commitment:** \"The deposit is how we hold a dedicated slot with the doctor just for you. Your appointment time is reserved, and the full £250 counts towards your treatment.\"\n\nThen stop talking and wait. Never apologise for the deposit.\n\nNever name or criticise another clinic.", "h": "Call flow and approved scripts"}, {"body": "Only start after the pitch:\n> Now that you know how it works, I just need to ask a few quick questions so the doctor can assess you properly.\n\nOne at a time, write every answer down, never tell the patient they are or aren't suitable. After any \"yes\": \"Thank you, I'll pass that on to the doctor.\"\n\n1. Are you pregnant, trying to conceive or breastfeeding?\n2. Have you had a nose job (surgical rhinoplasty) or any nose injury or break? If so, when?\n3. Have you had filler in your nose before? Do you know which type, and when?\n4. Have you had any other filler, Botox or skin treatment on your face recently?\n5. Do you have any allergies, especially to local anaesthetic (lidocaine) or to previous fillers?\n6. Do you take blood thinners, aspirin or supplements like fish oil, or have any bleeding or clotting problems?\n7. Do you have an autoimmune condition, or any active skin problem on or around your nose?\n8. Have you had dental work, a vaccine or an illness in the last two weeks, or do you have any planned soon?\n9. Do you wear glasses every day?\n10. Timing: is there an event, photos or a holiday in the next few weeks we should plan around?", "h": "Screening questions"}, {"body": "**Follow-through after every rebuttal:** (1) answer simply, (2) check: \"Is that the only thing, or is there anything else?\", (3) ask for the next step: \"Perfect, I'm sending that email now. Can you reply with your photos today?\"\n\n**\"I want to talk to my husband / partner.\"**\n> Of course, that makes sense.\n> If it was just up to you, is this something you'd want to go ahead with?\n> What do you think their main question will be?\n> Would it help if I sent you the email with our before and afters, so you can show them?\n\n**\"I need to think about it.\"**\n> Of course, it's a big decision and I'd want to think about it too.\n> Usually when someone says that, it's one of three things: the treatment itself, the price, or the timing. Which one is it for you?\n> [Answer that one thing.]\n> Is that the only thing, or is there anything else?\n\n**\"I need to check and explore my options.\"**\n> That's smart, you should feel sure.\n> What matters most to you when you compare clinics?\n> When you compare, it's worth asking each clinic who does the treatment and to see their before and afters.\n> Shall I send you ours now so you have something to compare against?\n\n**\"I don't want to pay a deposit.\"**\n> It sounds like you want to be sure before you put money down, which makes complete sense.\n> The £250 isn't an extra charge. It's part of your £600, so you're not spending anything you wouldn't spend on the treatment anyway.\n> And you only pay it once the doctor has looked at your photos and confirmed you're suitable, so you're never paying for something that isn't right for you.\n> Does that change how it feels for you?\n\nPause after each line and let the patient answer.\n\n**\"It's too expensive.\"**\n> That's fair, it is an investment.\n> When you say it's too expensive, is that compared with something you've seen, or with what you had in mind to spend?\n> What would you need to see or hear to feel confident this treatment is worth it for you?\n> When we spoke, you told me [the bump on your bridge] really bothers you and you want it done properly. Is that still how you feel?\n> Based on everything you've told me, which feels right for you: getting the doctor's opinion on your photos now, or leaving [their concern] as it is for now?\n\nAfter \"That's fair, it is an investment\", stop and wait; don't fill the silence. Pause after each line and let the patient answer. Never defend the price or offer a discount. If it's the budget, use the split: £250 now, £350 on the day. No finance.\n\n**\"I've seen it cheaper elsewhere.\"**\n> You probably can.\n> When you say cheaper, are you talking about the same treatment and the same result, just at a lower price?\n> What have you seen from the other clinic that gives you confidence you'll get the same result?\n> When we spoke, you told me [their concern] really bothers you and you want it done properly. Is that still how you feel?\n> Which option gives you the most confidence that you'll get the result you're looking for?\n\nPause after each line and let the patient answer. Never criticise another clinic.\n\nAfter \"You probably can.\", stop talking and let the patient fill the silence. Optional, only if the patient says the other clinic offers the same treatment:\n> And that's fair. The way I see it, the most expensive treatment isn't always the one with the highest price. It's the one you end up having to do twice. Which option gives you the most confidence you'll get it right the first time?\n\n**\"I need more time.\" / \"Maybe in a month or two.\"**\n> Sure, absolutely, take the time you need.\n> I just have one question: 30 days from now, what's going to change?\n> I ask because so many of our patients take their time, and once they've had the treatment, the only thing they tell us they regret is not doing it sooner.\n> So what's really holding you back right now? If there's a question I can answer, I'd love to help.\n\nPause after each line and let the patient answer.\n\n**\"It's not about the money.\"**\n> I completely understand, and I'm glad to hear that.\n> As long as we're on the same page that this is an investment in yourself, and it's absolutely worth it. When it comes to our face and our body, it's not something we shop around for a sale on, right?\n> Then let's go ahead and arrange your consultation. Can you reply with your photos today, so the doctor can review them first?\n\n**\"Can I get a discount?\"**\n> That's a great question, and I get it. You want the best result for the best price, and that's exactly what we want for you too.\n> Can I ask you something? Would you get on a plane if the airline's slogan was \"Fly with us, our pilots work for the lowest wages\"?\n> Probably not, right? When something really matters, you want the best person in charge, not the cheapest.\n> It's the same with your face. Our prices are set by the clinic, because you're in the hands of Dr SW and his team, and that's what gets you the result you're looking for.\n> Does that make sense?\n\nPause after each line. If this treatment has an ongoing offer on the Offers tab, share that offer exactly as written. Never invent a discount or criticise another clinic. No finance on this treatment.\n\n**\"I've been disappointed by a clinic before.\"**\n> I'm really sorry, that must have been frustrating.\n> What happened, if you don't mind me asking?\n> That's exactly why our consultations are designed around you. The doctor looks at your concern, your history and what you want to achieve before anything goes ahead, so nothing is decided for you.\n> And the doctor reviews your photos before anything is booked.\n> What would you need to see from us to feel confident this time?\n\n**\"Why do I need a consultation? Can't I just book the treatment?\"**\n> I love that you're ready to go.\n> Every treatment is designed around the patient, so the doctor needs to confirm what's right for you first. That's how you get the result you want, not just a treatment.\n> And the £250 to secure it comes off your treatment, so it isn't an extra cost.\n> Can you reply with your photos today?\n\n**\"Does it hurt?\"**\n> It sounds like comfort matters to you, and that's why a local anaesthetic may be used to help reduce discomfort. It's also quick, around 20 to 25 minutes.\n\n**\"Will people notice straight away?\"**\n> Some swelling or bruising can occur after the treatment, so if there's an event coming up, we'll plan your appointment around it. The doctor will take you through exactly what to expect for you.\n\n**\"How long does it last? Is it permanent?\"** (only when the patient asks)\n> Great question. Results typically last around 12 to 15 months, depending on the filler, and the doctor will tell you exactly what to expect for you. A lot of patients actually like that, because it's a way to refine your profile without surgery and without a lifelong commitment.\n\n**\"I'm scared it will go wrong.\"**\n> It sounds like you want to feel safe, which is exactly right. That's why the doctor reviews your photos and your answers first, before anything is booked. And many of our patients have had filler before and come to us to get it right, so the doctor is very experienced in exactly this.\n\n**\"Just send me the details and I'll get back to you.\"**\n> Of course, I'm sending it right now.\n> So you get the most out of it, which part matters most to you: the before and afters, or what the treatment involves?\n> And when you reply with your photos, would today or tomorrow be easier?\n\n**\"I don't live in London.\"**\n> That's no problem at all, a lot of our patients don't. We see patients from all over the UK, and people travel to us from the USA, Dubai and all over Europe. The good news is you can have your consultation and your treatment on the same day, so it's one trip. And the treatment itself takes around 20 to 25 minutes, with immediate results.\n\n**\"I've had filler before and didn't like it.\"**\n> I'm really glad you told me, and you're not alone: a lot of the patients we see have had filler elsewhere and come to us to get it looking the way they wanted. That's why the doctor looks at your photos first. Can you include a photo of how it looks now, and tell me roughly when it was done?", "h": "Rebuttals"}, {"body": "Copy, fill in the [brackets], and send.\n\n### SMS: no answer (1st attempt)\n!> Hi [Patient Name], it's [Patient Advisor Name] from DR SW Clinics. I'm following up on your enquiry about non-surgical nose reshaping. What would you most like the doctor to assess: a bump on the bridge, a hooked tip, unevenness, or your overall profile? I can then point you towards the most relevant information.\n\n### SMS: 1–2 days after sending the treatment info email\n!> Hi [Patient Name], hope you're doing well 😊 Just checking in to see if you had a chance to look over the information I sent yesterday about Non-Surgical Nose Reshaping.\n!> If any questions came up, or you'd like to talk through what you're hoping to address, just reply here. I'm happy to help, no rush at all.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: missed call\n!> Hi [Patient Name], looks like we missed each other on the phone just now. No worries at all. Is there a better time for me to call, or would you prefer to chat by text? I'm happy to help with any questions about the treatment.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: request the photos\n!> Subject: Photos for your Non-Surgical Nose Reshaping assessment\n!>\n!> Hi [Patient Name],\n!> To help our doctor review your concerns and advise on the next steps, could you please reply to this email with a few recent photos of your nose?\n!> If you're comfortable, please include:\n!> - A straight-on photo\n!> - A profile photo from the left\n!> - A profile photo from the right\n!> - A slightly angled photo, if convenient\n!>\n!> Please use clear, natural lighting and avoid filters. The photos should show your full nose clearly.\n!> The doctor can use these for an initial review, but photos alone cannot confirm suitability. A consultation and medical assessment may still be needed. Please only send photos you're comfortable sharing. If you'd prefer to discuss this in a consultation instead, let me know.\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: did not dial (DND)\n!> Subject: Your Non-Surgical Nose Reshaping enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in Non-Surgical Nose Reshaping at DR SW Clinics.\n!> If you're looking to refine a bump on the bridge, uneven contours or the appearance of a hooked tip, this treatment may help create a smoother, more balanced profile without surgery. It uses hyaluronic acid dermal filler to add definition and camouflage selected contours. Because filler adds volume, it does not physically make the nose smaller; the doctor will assess whether it can address your specific concern.\n!> Treatment usually takes around 20–25 minutes. When suitable, the initial change is visible straight away, so you can see the difference before leaving the clinic. Mild swelling or bruising can occur as the result settles. Results can last up to around 12 months, depending on the filler used and individual factors.\n!> The doctor will tailor the treatment plan to your features and goals, assess your suitability, and discuss the potential risks and alternatives with you. The treatment is £600 in total.\n!> The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> Reply with your main concern and a convenient time to speak, and I'll help arrange the next step.\n!> You can read more about the treatment and view before-and-after examples here:\n!> https://drswclinics.com/treatment/non-surgical-nose-re-shaping-rhinoplasty/\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: treatment info and testimonials\n!> Subject: Your Non-Surgical Nose Reshaping enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in Non-Surgical Nose Reshaping at DR SW Clinics.\n!> If you're looking to refine a bump on the bridge, uneven contours or the appearance of a hooked tip, this treatment may help create a smoother, more balanced profile without surgery. It uses hyaluronic acid dermal filler to add definition and camouflage selected contours. Because filler adds volume, it does not physically make the nose smaller; the doctor will assess whether it can address your specific concern.\n!> Treatment usually takes around 20–25 minutes. When suitable, the initial change is visible straight away, so you can see the difference before leaving the clinic. Mild swelling or bruising can occur as the result settles. Results can last up to around 12 months, depending on the filler used and individual factors.\n!> The doctor will tailor the treatment plan to your features and goals, assess your suitability, and discuss the potential risks and alternatives with you. The treatment is £600 in total.\n!> The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> To update your details, could you please reply with your postcode? If you'd like to arrange a consultation, just let me know and I'll be happy to help.\n!> You can read more about the treatment and view before-and-after examples here:\n!> https://drswclinics.com/treatment/non-surgical-nose-re-shaping-rhinoplasty/\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: phone number not working\n!> Subject: Quick question about your enquiry at Dr SW Clinics\n!>\n!> Hi [Patient Name],\n!>\n!> Thank you for your enquiry about Non-Surgical Nose Reshaping at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd love to help you with any questions.\n!>\n!> I tried to call you, but I couldn't get through on the number we have on file. It may have been entered incorrectly.\n!>\n!> Could you please reply with the best number to reach you, including the country code? It would also help to know a good day and time to call.\n!>\n!> If you'd rather chat by email, that's absolutely fine too. Just reply here with any questions.\n!>\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics", "h": "Messages and emails"}, {"body": "**What exactly is the treatment?** \"It's a non-surgical rhinoplasty. We use hyaluronic acid dermal filler to refine the profile of your nose and, where suitable, soften the look of bumps or uneven contours.\"\n\n**Is it surgery?** \"No, it's non-surgical. No scalpel and no operating theatre.\"\n\n**Can it make my nose smaller?** \"The filler refines the profile and softens the look of bumps or uneven contours. The doctor will tell you what's possible for your nose from your photos.\"\n\n**How long does it take?** \"Around 20 to 25 minutes.\"\n\n**How long do results last?** \"The results are immediate and typically last around 12 to 15 months, depending on the filler.\"\n\n**Am I suitable?** \"That's exactly why the doctor reviews your photos first. Reply to my email with your photos and the doctor will confirm.\"\n\n**How much doe
