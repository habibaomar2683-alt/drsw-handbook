<title>Dr SW Agent Handbook</title>

<style>
/* Layout: dark clinic header band, left topic rail + reading column; editor replaces the reading column for managers. */
:root{
  --ink:#101315;          /* Dr SW near-black */
  --gold:#C6A84C;         /* Dr SW gold */
  --gold-deep:#8C7228;    /* gold for text on light grounds */
  --mist:#DFE7EB;         /* Dr SW blue-grey */
  --bg:#F5F5F5;
  --surface:#FFFFFF;
  --text:#212121;
  --muted:#5B6166;
  --line:#E2E4E3;
  --gold-text:var(--gold-deep);
  --gold-wash:rgba(198,168,76,.12);
  --danger:#A3352B;
  --ok:#2F6B4A;
  --header-bg:var(--ink);
  --header-fg:#F5F5F5;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E10;--surface:#15191C;--text:#E9E7E1;--muted:#9AA1A6;--line:#262B2F;
  --gold-text:#D4B95F;--gold-wash:rgba(198,168,76,.14);--mist:#1E2529;--danger:#E07A6F;--ok:#7FC39C;
  --header-bg:#08090A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E10;--surface:#15191C;--text:#E9E7E1;--muted:#9AA1A6;--line:#262B2F;
  --gold-text:#D4B95F;--gold-wash:rgba(198,168,76,.14);--mist:#1E2529;--danger:#E07A6F;--ok:#7FC39C;
  --header-bg:#08090A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header-bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.band{background:var(--header-bg);color:var(--header-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid rgba(198,168,76,.35)}
.band-in{max-width:1240px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:26px;line-height:1;letter-spacing:.01em;color:#fff;display:flex;flex-direction:column}
.mark small{font-family:var(--body);font-size:9.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.band-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#B9BEC1;border-left:1px solid #33393D;padding-left:16px}
.band-sp{flex:1}
.role{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid #3A4044;color:#D9DDDF;white-space:nowrap}
.role i{width:7px;height:7px;border-radius:50%;background:#8A9094}
.role.mgr{border-color:var(--gold);color:var(--gold)}
.role.mgr i{background:var(--gold)}

.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:22px}
.search{position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.grp h4{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.nav button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:8px 12px;border-radius:var(--r);border-left:2px solid transparent;color:var(--text)}
.nav button:hover{background:var(--gold-wash)}
.nav button[aria-current="page"]{border-left-color:var(--gold);background:var(--gold-wash);color:var(--gold-text);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .empty{color:var(--muted);font-size:13px;padding:4px 12px}
.addbtn{all:unset;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--gold-text);font-weight:600;padding:2px 4px;border-radius:4px}
.addbtn:hover{background:var(--gold-wash)}
.railnote{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

main{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
h1.title{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,42px);line-height:1.12;margin:6px 0 10px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.head>div:first-child{min-width:0;flex:1 1 320px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000;border-color:var(--gold)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#101315;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#101315;border-color:var(--gold)}}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toc{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.toc button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.toc button:hover{color:var(--gold-text);border-color:var(--gold)}

.sec{padding:26px 0;border-bottom:1px solid var(--line);scroll-margin-top:110px}
.sec:last-child{border-bottom:0}
.sec h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 10px;line-height:1.25;text-wrap:balance}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose strong{font-weight:700}
.prose h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.script{position:relative;margin:4px 0 14px;padding:14px 16px 14px 18px;background:var(--gold-wash);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0}
.script .lab{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-text);font-weight:700;margin-bottom:6px}
.script .lab button{all:unset;cursor:pointer;font-size:11.5px;letter-spacing:.04em;text-transform:none;color:var(--gold-text);padding:2px 6px;border-radius:4px}
.script .lab button:hover{background:var(--gold-wash)}
.script p{margin:0 0 6px;font-style:italic}
.tmpl{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold)}
.tmpl .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.shot{margin:6px 0 16px;max-width:100%}
.shot img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.shot figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.prose a{color:var(--gold-text);text-underline-offset:2px;overflow-wrap:anywhere}
.pending{color:var(--muted);font-style:italic;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;max-width:68ch}

.state{padding:48px 0;max-width:56ch}
.state h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 8px}
.state p{color:var(--muted)}

.results{display:flex;flex-direction:column;gap:2px;margin-top:18px}
.hit{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:14px 16px;border-radius:var(--r);border:1px solid transparent}
.hit:hover,.hit:focus-visible{background:var(--surface);border-color:var(--line)}
.hit .t{font-weight:600}
.hit .t span{color:var(--muted);font-weight:400}
.hit .s{font-size:13.5px;color:var(--muted);margin-top:2px}
mark{background:rgba(198,168,76,.35);color:inherit;border-radius:2px;padding:0 1px}

/* editor */
.ed{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.field label{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field textarea{min-height:150px;resize:vertical;line-height:1.55;font-size:14px}
.edsec{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.edsec .row{display:flex;gap:8px;align-items:center}
.edsec .row input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-weight:600}
.edsec textarea{width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);resize:vertical;line-height:1.55;font-size:14px}
.ic{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:var(--r);width:34px;height:34px;display:grid;place-items:center;flex:none}
.ic:hover{border-color:var(--gold)}
.ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.hint code{background:var(--gold-wash);padding:1px 5px;border-radius:3px;font-size:12px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:10px 14px;border:1px solid var(--danger);border-radius:var(--r);margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13.5px;border:1px solid var(--gold);z-index:20}

.mobnav{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:18px}
  .rail{position:static}
  .band-title{display:none}
  .rail .grp,.rail .railnote{display:none}
  .rail.open .grp{display:block}
  .mobnav{display:block}
}
@media (prefers-reduced-motion:no-preference){.sec,.state{animation:fade .25s ease both}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

</head>

<script>
try{window.__ADVISOR=(new URLSearchParams(location.search).get('advisor')||'').replace(/[^A-Za-z .\'-]/g,'').trim().slice(0,40)}catch(e){}
(function(){var DATA={"kb": [{"id": "process", "data": {"kind": "process", "order": 1, "sections": [{"body": "- Consultation with the doctor: **£250**\n- The £250 consultation fee is **redeemable against the cost of treatment** when the patient goes ahead.\n- **0% finance** is only available on treatments of **£1,000 and above**. See the 0% finance option below.", "h": "Pricing at a glance"}, {"body": "1. **Before the visit:** the patient fills in the medical forms sent to them by email.\n2. **Arrival:** the patient arrives at the clinic and is offered a welcome drink.\n3. **Welcome:** our clinical team welcomes the patient and shows them a video about their treatment.\n4. **Consultation:** the patient goes in for their consultation with the doctor.", "h": "The consultation process"}, {"h": "Booking a consultation", "body": "Once the patient is ready to book:\n\n1. **Choose the day and time** that suits the patient.\n2. **Take the payment** (the £250 deposit).\n3. **After the payment is done, ask the patient for their postal code.**\n4. **Add the appointment on Zenoti:** https://drswclinics.zenoti.com/\n\nFor step 4, follow the **Zenoti Process** tab."}, {"body": "### Context\nMost patients are reluctant to pay a deposit, so expect this on most calls. Never apologise for it.\n\n### The rule\nThe £250 secures the consultation on our system and is **redeemable against the cost of treatment**. Present it as the first part of the treatment, never as an extra fee. Say \"secure\", \"hold\" or \"reserve\", never \"fee\" or \"charge\".\n\n### Approved script (after the doctor review is set up)\n> I'm going to take your photos and show them to the doctor to assess them. Once I've confirmed your suitability I'll call you to let you know. To book your appointment on our system, it requires a £250 deposit to secure the consultation, and it comes off the cost of your treatment. Once I have your suitability confirmed I'll call you and help you with every step along the way.\n\n### Ways to frame it\n- **The head start:** \"Think of the £250 as your first payment towards your treatment. You're not paying for a consultation, you're paying towards your treatment.\"\n- **The split:** \"It's [total] in two parts: £250 now to lock in your doctor's time, and the rest on the day.\"\n- **The commitment:** \"The deposit is how we hold a dedicated slot with the doctor just for you, and the full £250 counts towards your treatment.\"\n\nThen stop talking and wait.\n\nAlways mention that we're **almost fully booked**. We're a very busy clinic, so it's always true, and it gives the patient a reason to act quickly:\n> Just a heads-up, we're almost fully booked, so once the doctor confirms your suitability I'll call you straight away to secure your place.", "h": "Deposit fee and how to pitch it"}, {"body": "### How it works\n- The patient can pay in instalments over **3, 6, 9 or 12 months** with **0 interest**.\n- All they pay up front is the **£250 deposit**. The rest is paid in instalments.\n- Available on treatments of **£1,000 and above only**. Nothing less can be financed.\n\n### \"So what am I going to pay monthly?\"\nDivide the **full treatment cost** by the number of months the patient chooses.\n- Example: a £3,000 treatment over 12 months = £250 a month.\n\n### Booking tip\nIf the patient is interested in 0% finance, book them **early: 11am, 12pm or 1pm**, so the clinic team can finalise the finance for them on the same day.", "h": "0% finance option"}, {"h": "Approved rebuttals (all treatments)", "body": "**Follow-through after every rebuttal:** answer simply, check \"Is that the only thing, or is there anything else?\", then ask for the next step: \"Can you reply with your photos today?\"\n\n**\"I want to talk to my husband.\"**\n> Sure, talking to your husband is really important. Can I know what questions your husband might have, so I can answer all of them?\n\n**\"I need to think about it.\"**\n> Sure. Can I know what questions you have, so I can answer them and help you in your thought process with any answers that I might have?\n\n**\"I need to check and explore my options.\"**\n> Sure. What options do you need to check or consider? If I have any information, I can help you with it.\n\n**\"I don't live in London.\"**\n> That's no problem at all, a lot of our patients don't. People travel to us from the USA, Dubai and all over Europe, and you can have your consultation and your treatment on the same day, so it's one trip."}, {"h": "Refunds", "body": "**This is not a must.** You don't have to mention refunds on every call. Only bring it up if the patient asks.\n\nWhen it does come up:\n- All refund requests are subject to an **eligibility review and approval**.\n- An approved refund can take **up to 28 working days** to process.\n- Contacting the clinic before the 28 working days have passed won't speed it up, so ask patients to allow the full period before chasing.\n\n> Refund requests go through an eligibility review. Once a request is approved, the refund can take up to 28 working days to process."}, {"h": "Not one treatment fits all", "body": "We have a variety of treatments, and each one is designed around the patient's needs. That is why every patient has a consultation with the doctor before going ahead.\n\nAlways say **rejuvenation**, never \"renewal\"."}, {"body": "When a patient raises a concern:\n1. Acknowledge it respectfully. Don't argue or dismiss it.\n2. Ask one brief question if you need to understand the concern.\n3. Respond directly using relevant, verified information.\n4. Explain options or trade-offs honestly, including when the treatment may not be a fit.\n5. Ask whether that addresses the concern, then suggest a reasonable next step if appropriate.\n\nBe ready for concerns about **price, timing, trust, competitors, who makes the decision, risk, and whether the treatment is necessary**. Tailor each answer to what the patient actually said. No canned rebuttals.", "h": "Handling objections"}, {"body": "- Learn what the patient needs before recommending anything.\n- Keep replies clear, natural and concise. Ask one question at a time.\n- Don't pressure, shame, mislead or create false urgency.\n- Never invent features, prices, results, policies, testimonials or guarantees. If you don't know, say so and offer to find out.\n- Recommend a treatment only when it fits the patient's needs. If it doesn't, say so and explain why.\n- If the patient clearly says no, acknowledge it and end politely.\n- If the patient asks for a person, arrange the handoff.", "h": "Conversation rules"}], "title": "Clinic Process at a Glance", "updatedAt": 1793026467617, "updatedBy": null}}, {"id": "zenoti", "data": {"kind": "process", "title": "Zenoti Process", "order": 2, "updatedAt": 1793026467617, "updatedBy": null, "sections": [{"h": "Step 1: Open Zenoti", "body": "Go to https://drswclinics.zenoti.com/"}, {"h": "Step 2: Log in to Zenoti", "body": "Log in with your own Zenoti username and password. Never share your login with anyone."}, {"h": "Step 3: Go to Appointments", "body": "From the Admin Dashboard, click the **Appointment** icon (calendar) in the left menu.\n\n![Appointment icon in the left menu](img:z3)"}, {"h": "Step 4: Choose the day", "body": "Click the date at the top and pick the day from the calendar.\n\n![Choosing the day from the calendar](img:z4)"}, {"h": "Step 5: Click the time slot", "body": "Left-click on the empty slot at the chosen time, in the doctor's column.\n\n![Left-click on the chosen time slot](img:z5)"}, {"h": "Step 6: Choose New Appointment", "body": "![Choose New Appointment](img:z6)"}, {"h": "Step 7: Fill in the patient information", "body": "Fill in the required fields: mobile, first name, last name, email and gender.\n\n![Patient information form](img:z7)"}, {"h": "Step 8: Add the service", "body": "Select the consultation service the patient needs, for example **Plexr Consultation** or **O Concept for Him Consultation**, then click **Add Service**.\n\n**Make sure the consultation price is £250.**\n\n![Adding the service](img:z8)"}, {"h": "Step 9: Add a note", "body": "Click **Add Note** and write your initials and the medical screening.\n\nExample: Olivia Clark → **O.C**, followed by the screening answers.\n\n![Appointment Notes box](img:z9)"}, {"h": "Step 10: Save the note and the appointment", "body": "Click **OK** to save the note, then click **Save** to save the appointment.\n\n![Add Note, Take Payment and Save buttons](img:z10a)\n\n![Save button](img:z10b)"}]}}, {"id": "blepharoplasty", "data": {"kind": "treatment", "title": "Non-Surgical Blepharoplasty (Plexr)", "order": 10, "updatedAt": 1793016315524, "updatedBy": null, "sections": [{"h": "At a glance", "body": "- **Treatment:** non-surgical blepharoplasty, eyelid and eye-area skin rejuvenation with the **Plexr** machine.\n- **Technology:** plasma frequency.\n- **How it works:** local numbing cream goes on the area of concern. We go over the area with the Plexr machine, which takes the skin from a solid state straight to a gas state. This forms small scabs, and as they heal the skin rejuvenates itself using the patient's own anatomy.\n- **Frequency:** one-time treatment.\n- **Healing:** 10 to 14 days. It's a skin rejuvenation process that helps the body tighten the skin naturally.\n- **Authority:** Dr SW introduced the Plexr machine to Europe.\n- **Entry step:** patient emails photos, the doctor reviews them and confirms suitability.\n- **Deposit:** £250 secures the consultation and is redeemable against the treatment.\n- **Finance:** 0% over 3, 6, 9 or 12 months, only if the total is £1,000 or more.\n- **Price:** to be confirmed by management.\n\n### Not one treatment fits all\nEvery treatment is designed around the patient's needs. That is why the patient has a consultation with the doctor before anything goes ahead."}, {"h": "Golden rules", "body": "- **Always pitch the treatment.** Even if the patient says they don't need any info or have no questions. It is the only sale point we have.\n- **Explain first, screen second.** Never ask a screening question until the treatment has been explained.\n- **Be confident.** No \"unfortunately\", no \"I'm afraid\", no \"we don't have WhatsApp\". Say what we do, never what we don't.\n- **One path, no options.** Email, photos, doctor confirms suitability, deposit, booking.\n- **Use the patient's words.** Say \"your upper lids\" or \"your lower eyelids\", never just \"the area\".\n- **Always say rejuvenation**, never \"renewal\".\n- **Don't over-sell.** If the patient has done their research, confirm what they know and move forward.\n- **Never promise results and never diagnose.** The doctor decides suitability."}, {"h": "Selling points", "body": "1. **No surgery.** No scalpel and no operating theatre.\n2. **Their own anatomy.** The skin rejuvenates itself.\n3. **One-time treatment.** No course of sessions to commit to.\n4. **Comfortable.** Local numbing cream is applied first.\n5. **Doctor-led.** Dr SW introduced the Plexr machine to Europe.\n6. **Proof.** Before and after pictures are in the email we send.\n7. **Personalised.** The doctor reviews the patient's photos first, and each treatment is designed for the patient's needs."}, {"h": "Call flow and approved scripts", "body": "### Step 1: Open\n> Hi [name], it's [your name] from Dr SW Clinics. Thanks for your enquiry about our non-surgical blepharoplasty. Tell me, what's concerning you most about your [upper eyelids / lower eyelids]?\n\nListen, then label what you heard and narrow it down:\n> It sounds like your [upper eyelids / lower eyelids] are really getting to you, and that is exactly the kind of concern we treat. Is it excess upper eyelid skin, under-eye bags, fine lines or wrinkles, looking tired even when well rested, or a combination of those?\n\nOnly offer the options that match the area the patient mentioned:\n- **Excess upper eyelid skin:** upper eyelids only.\n- **Under-eye bags:** lower eyelids only.\n- **Fine lines or wrinkles:** upper and lower.\n- **Looking tired even when well rested:** upper and lower.\n- **A combination of those:** upper and lower.\n\n### Step 2: The pitch (always, no skipping)\n> Let me explain how it works so you know exactly what to expect. First, we apply a local numbing cream to your [area of concern], so you're comfortable. Then we use the Plexr machine, which works with plasma frequency. We go over the area with the machine and it takes the skin from a solid state straight to a gas state. That forms small scabs, and while they heal your skin rejuvenates itself, using your own anatomy. And it's a one-time treatment, so there's no course of sessions and no surgery. Something that reassures a lot of our patients: Dr SW is the doctor who introduced the Plexr machine to Europe, so you're in very experienced hands.\n\n**If the patient says \"I don't need any info\":**\n> Perfect, you're clearly well informed. I'll just take you through it quickly so we're on the same page. We numb your [area] with a local cream, then go over it with the Plexr plasma machine, which takes the skin from solid to gas. That forms small scabs, your skin rejuvenates itself, and it's a one-time treatment. And Dr SW is the doctor who introduced the Plexr machine to Europe, so you're in very experienced hands. Does that sound like what you were looking for?\n\n**If the patient has done their research** (one light line about Dr SW, don't over-sell):\n> You've clearly done your homework, so I won't repeat what you already know. You've probably seen that Dr SW is the one who brought Plexr to Europe, so you're in good hands. The key thing is that the doctor looks at your own photos first and confirms this is right for your [area].\n\n### Step 3: Screening questions\nSee the Screening questions section.\n\n### Step 4: The email and photos\n> Here's what happens next. I'm sending you an email right now with all our information, including before and after pictures. Reply to that email with photos of your [area], and I'll show them to the doctor to confirm you're suitable for the treatment, or recommend the treatment that suits you best.\n\nPhoto guide: natural light, no make-up, eyes open looking straight at the camera, one from the front, one from each side, and a close-up of the area of concern.\n\nIf they ask to send photos another way:\n> Email is the quickest way to get this to the doctor, because everything sits together on your file. As soon as you see my email, just hit reply with your photos.\n\n### Step 5: Expectations and the deposit\n> I'm going to take your photos and show them to the doctor to assess them. Just a heads-up, we're almost fully booked, so once I've confirmed your suitability I'll call you to let you know. To book your appointment on our system, it requires a £250 deposit to secure the consultation. Once I have your suitability confirmed I'll call you and help you with every step along the way.\n\nAlways mention that we're almost fully booked. We're a very busy clinic, so it's true and it gives the patient a reason to send their photos quickly."}, {"h": "Screening questions", "body": "Only start after the pitch:\n> Now that you know how it works, I just need to ask a few quick questions so the doctor can assess you properly.\n\nAsk one at a time, write every answer down, stay calm, and never tell the patient they are or aren't suitable. After any \"yes\": \"Thank you, I'll pass that on to the doctor.\"\n\n1. Can I take your full name, please?\n2. What is your date of birth, please?\n3. Do you smoke or drink alcohol? If so, how frequently?\n4. Do you have any medical conditions or ongoing health issues that we should be aware of?\n5. Are you currently taking any medications or regular treatments?\n6. Do you have any allergies or previous reactions to medications or treatments?\n7. What concerns you most about your eye area at the moment?\n8. Have you noticed any puffiness, loose skin, heaviness, or tiredness around your eyelids or under-eye area?\n9. How long have you been noticing these changes?\n10. Have you had any previous treatments or procedures around your eyes? If so, when and what treatment did you have?\n11. Do you take blood thinners, or have any bleeding or clotting problems?\n12. Do you have diabetes or an autoimmune condition, or do cuts and scrapes heal slowly for you?"}, {"h": "Rebuttals", "body": "**Follow-through after every rebuttal:** (1) answer simply, (2) check: \"Is that the only thing, or is there anything else?\", (3) ask for the next step: \"Perfect, I'm sending that email now. Can you reply with your photos today?\"\n\n**\"I want to talk to my husband.\"**\n> Sure, talking to your husband is really important. Can I know what questions your husband might have, so I can answer all of them?\n\n**\"I need to think about it.\"**\n> Sure. Can I know what questions you have, so I can answer them and help you in your thought process with any answers that I might have?\n\n**\"I need to check and explore my options.\"**\n> Sure. What options do you need to check or consider? If I have any information, I can help you with it.\n\n**\"I don't want to pay a deposit.\"**\n> It sounds like you want to be sure before you put money down, which makes complete sense.\n> The £250 isn't an extra charge. It comes straight off the cost of your treatment, so you're not spending anything you wouldn't spend on the treatment anyway.\n> And you only pay it once the doctor has looked at your photos and confirmed you're suitable, so you're never paying for something that isn't right for you.\n> Does that change how it feels for you?\n\nPause after each line and let the patient answer.\n\n**\"It's too expensive.\"**\n> That's fair, it is an investment.\n> When you say it's too expensive, is that compared with something you've seen, or with what you had in mind to spend?\n> What would you need to see or hear to feel confident this treatment is worth it for you?\n> When we spoke, you told me [their concern] is really bothering you and you want it done properly. Is that still how you feel?\n> Based on everything we've discussed, what would give you the most confidence to move forward and get the result you're looking for?\n\nPause after each line and let the patient answer. Never defend the price or offer a discount. If the real issue is the monthly budget and the total is £1,000 or more, offer the 0% finance.\n\n**\"I've seen it cheaper elsewhere.\"**\n> You probably can.\n> When you say cheaper, are you talking about getting the same treatment and the same result, just at a lower price?\n> What have you seen from the other clinic that gives you confidence you'll get the same result?\n> When we spoke, you told me [their concern] is really bothering you and you want it done properly. Is that still how you feel?\n> Which option gives you the most confidence that you'll get the result you're looking for?\n\nPause after each line and let the patient answer. Never criticise another clinic.\n\n**\"Does it hurt?\"**\n> It sounds like comfort matters to you, and that's exactly why we apply a local numbing cream to your [area] before we start. And we also have the option to inject a numbing substance if you feel you can't tolerate the discomfort.\n\n**\"How long does it last? Is it permanent?\"**\n> It's a one-time treatment, so you don't need a course of sessions. Everyone's skin continues to age naturally, and the doctor will go through exactly what to expect for you.\n\n**\"Just send me the details and I'll get back to you.\"**\n> Of course, that's exactly what I'm doing right now. I'm sending the email with all our information and before and afters. Reply with your photos and the doctor can tell you what's right for you, so you're deciding with real information.\n\n**\"I'm worried about the scabs and healing.\"**\n> It sounds like you want to know what healing looks like, which is smart. Healing takes 10 to 14 days. The scabs are part of the process: it's a skin rejuvenation process that helps your body tighten the skin naturally, and the doctor will take you through the aftercare in detail."}, {"h": "Messages and emails", "body": "Copy, fill in the [brackets], and send.\n\n### SMS: no answer (1st attempt)\n!> Hi [Patient Name],\n!> It's [Patient Advisor Name] from Dr SW Clinics.\n!> I was just reviewing your enquiry regarding the eye area treatment and wanted to quickly introduce myself.\n!> Just so I can point you in the right direction, would you say your main concern is:\n!> - excess upper eyelid skin,\n!> - under-eye bags,\n!> - fine lines/wrinkles,\n!> - looking tired even when well rested,\n!> - or a combination of those?\n!>\n!> Best,\n!> [Patient Advisor Name]\n\n### SMS: 1–2 days after sending the treatment info email\n!> Hi [Patient Name], hope you're doing well. Just checking in to see if you had a chance to look over the information I sent yesterday about Non-Surgical Blepharoplasty.\n!> If any questions came up, or you'd like to talk through what you're hoping to address, just reply here. I'm happy to help, no rush at all.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: missed follow-up call\n!> Hi [Patient Name], looks like we missed each other on the phone just now. No worries at all. Is there a better time for me to call, or would you prefer to chat by text? I'm happy to help with any questions about the treatment.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: treatment info and testimonials\n!> Hi [Patient Name],\n!>\n!> Thanks for your interest in Non-Surgical Blepharoplasty at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> Our treatment page explains how it works and what to expect:\n!> https://drswclinics.com/treatment/the-non-surgical-blepharoplasty/\n!> You can also hear from patients who've shared their experiences:\n!> https://www.youtube.com/watch?v=G_c6WIvdc5I\n!> https://www.youtube.com/watch?v=oXrtq7Rfx-Y\n!> https://www.youtube.com/watch?v=aw88sUFhkqI\n!> A doctor can assess whether the treatment may be suitable for you and talk through expected results and recovery.\n!>\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: did not dial (DND)\n!> Hi [Patient Name],\n!> Thanks for your interest in Non-Surgical Blepharoplasty at Dr SW Clinics. I'm [Patient Advisor Name], a Patient Advisor, and I'd be happy to help with your questions.\n!> Our treatment page explains how it works and what to expect:\n!> https://drswclinics.com/treatment/the-non-surgical-blepharoplasty/\n!> You can also hear from patients who've shared their experiences:\n!> https://www.youtube.com/watch?v=G_c6WIvdc5I\n!> https://www.youtube.com/watch?v=oXrtq7Rfx-Y\n!> https://www.youtube.com/watch?v=aw88sUFhkqI\n!> A doctor can assess whether the treatment may be suitable for you and talk through expected results and recovery. What would you most like to address: upper eyelid skin, under-eye bags, or lines around the eyes?\n!> Reply with your main concern and a convenient time to speak, and I'll help arrange the next step.\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: request the photos\n!> Subject: Photos for your Non-Surgical Blepharoplasty assessment\n!>\n!> Hi [Patient Name],\n!> To help our doctor review your concerns and advise on the next steps, could you please reply to this email with a few recent photos of your eye area?\n!> If you're comfortable, please include:\n!> - A straight-on photo looking at the camera, with your eyes open\n!> - A photo turned slightly to the left\n!> - A photo turned slightly to the right\n!>\n!> Please use clear, natural lighting, keep your face relaxed, and avoid makeup, filters or sunglasses if possible.\n!> The doctor will use the photos for an initial review. They won't confirm suitability on their own; a full assessment and consultation may still be needed. Please only send photos you're comfortable sharing. If you'd prefer not to send them by email, let me know and we can discuss arranging a consultation.\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics"}, {"h": "FAQs", "body": "**What exactly is the treatment?** \"It's a non-surgical blepharoplasty. We use the Plexr machine, which works with plasma frequency, to rejuvenate the skin on your [area] without surgery.\"\n\n**How does it work?** \"We numb your [area] with a local cream, then go over it with the Plexr machine. The plasma takes the skin from a solid state straight to a gas state, which forms small scabs. As they heal, your skin rejuvenates itself using your own anatomy.\"\n\n**Is it surgery?** \"No, it's non-surgical.\"\n\n**How many sessions will I need?** \"It's a one-time treatment.\"\n\n**What are the scabs?** \"They're part of the process. As they heal, your skin rejuvenates itself.\"\n\n**What is the healing time?** \"Healing takes 10 to 14 days. It's a skin rejuvenation process, and that helps your body tighten the skin naturally.\"\n\n**Am I suitable?** \"That's exactly why the doctor reviews your photos first. Every treatment is designed around your needs. Reply to my email with your photos and the doctor will confirm.\"\n\n**Who is the doctor?** \"Dr SW is the doctor who introduced the Plexr machine to Europe.\"\n\n**Why do I need to pay a deposit?** \"Our booking system requires a £250 deposit to secure your consultation, and it's redeemable against your treatment.\"\n\n**Can I see before and after photos?** \"Absolutely, they're in the email I'm sending you now.\"\n\n**Can I book today?** \"Once the doctor confirms your suitability from your photos, I'll call you and we'll book you in.\"\n\nStill to be confirmed by management: price, what patients feel, and results timeline. Never promise an outcome."}, {"h": "Never say", "body": "- \"Unfortunately…\" or \"I'm afraid…\"\n- \"We don't have WhatsApp\" or any other limitation.\n- \"Renewal\". Always say **rejuvenation**.\n- \"Guaranteed\", \"permanent\", \"risk-free\", \"you'll look 10 years younger\".\n- Anything that diagnoses, or tells a patient they are or aren't suitable.\n- Other treatments or options before the doctor has reviewed the photos.\n- A screening question or the deposit before the treatment has been explained.\n- Finance on anything under £1,000.\n- Anything negative about another clinic."}]}}, {"id": "rhinoplasty", "data": {"kind": "treatment", "title": "Non-Surgical Rhinoplasty", "order": 20, "updatedAt": 1793016315524, "updatedBy": null, "sections": [{"h": "At a glance", "body": "- **Treatment:** non-surgical rhinoplasty (often called a \"liquid nose job\").\n- **Product:** hyaluronic acid dermal filler.\n- **What it does:** refines the nose's profile and, where suitable, softens the appearance of bumps or uneven contours.\n- **Time:** around 20–25 minutes.\n- **Comfort:** local anaesthetic may be used to help reduce discomfort.\n- **Results:** immediate, and typically last 12–15 months depending on the filler. They vary by individual.\n- **Price:** **£600**.\n- **Deposit:** £250 secures the consultation and is redeemed against the £600, so the balance on the day is **£350**.\n- **Finance:** not available. 0% finance starts at £1,000, so never offer it for this treatment.\n- **Same day:** consultation and treatment can be done on the same day.\n\n### Not one treatment fits all\nEvery treatment is designed around the patient's needs. That is why the patient has a consultation with the doctor before anything goes ahead."}, {"h": "Golden rules", "body": "- **Always pitch the treatment**, even if the patient says they don't need any info.\n- **Explain first, screen second.**\n- **Be confident.** No \"unfortunately\", no \"I'm afraid\".\n- **One path, no options.** Email, photos, doctor confirms suitability, deposit, booking.\n- **Use the patient's words.** \"The bump on your bridge\", \"your profile\", never just \"the area\".\n- **The £250 is part of the £600, never an extra.**\n- **Don't over-sell** to a patient who has done their research.\n- **Never promise results and never diagnose.** The doctor decides suitability.\n- **Temporary results, swelling and bruising are not part of the pitch.** If the patient asks, answer fully and honestly using the rebuttals."}, {"h": "Selling points", "body": "1. **No surgery.** No scalpel, no operating theatre, no general anaesthetic.\n2. **Quick.** Around 20–25 minutes, with immediate results, and consultation and treatment can be on the same day.\n3. **Comfortable.** Local anaesthetic may be used to help reduce discomfort.\n4. **Refines, doesn't replace.** Smooths the profile and softens the look of bumps or uneven contours, where suitable.\n5. **Simple.** No surgery and no recovery from an operation, just a short treatment with the doctor.\n6. **Doctor-led.** The doctor reviews the patient's photos first. Patients travel to us from the USA, Dubai and all over Europe.\n7. **Proof.** Before and after pictures are in the email we send.\n8. **Clear price.** £600 in total, and the £250 deposit comes off it."}, {"h": "Call flow and approved scripts", "body": "### Step 1: Open\n> Hi [name], it's [your name] from Dr SW Clinics. Thanks for your enquiry about our non-surgical rhinoplasty. Tell me, what's bothering you most about your nose: is it a bump on the bridge, the profile from the side, or something feeling uneven?\n\nListen, then label:\n> It sounds like [the bump on your bridge / your side profile] is really getting to you, and that is exactly the kind of concern this treatment is designed for.\n\n### Step 2: The pitch (always, no skipping)\n> Let me tell you why patients who feel exactly like you do about [the bump on your bridge] choose this treatment. With no surgery and no operating theatre, the doctor uses a hyaluronic acid dermal filler to refine your profile and, where it's suitable, soften the look of [that bump / that uneven line]. The treatment itself takes around 20 to 25 minutes, a local anaesthetic may be used to keep you comfortable, and the results are immediate, so you see the difference before you leave. So instead of months thinking about surgery, you could be looking at your profile in a different way in under half an hour of treatment. Picture seeing a side-on photo of yourself and not noticing [the bump] first. And something that reassures a lot of our patients: people travel to see Dr SW from the USA, Dubai and all over Europe, and many of the patients we see have had nose filler before and come to us to get it looking the way they always wanted, so the doctor knows exactly what makes the difference between a good result and a great one. Is that the kind of change you've been hoping for?\n\n**If the patient says \"I don't need any info\":**\n> Perfect, you clearly know what you want, so I'll keep it to 20 seconds. No surgery: the doctor uses hyaluronic acid filler to refine your profile and soften [your bump], it takes around 20 to 25 minutes, and a local anaesthetic may be used so you're comfortable. Most people are surprised how simple it is. Does that sound like what you were looking for?\n\n**If the patient has done their research:**\n> You've clearly done your homework, so I won't repeat what you already know. The key thing is that the doctor looks at your own photos first and confirms this is right for your nose.\n\n### Step 3: Screening questions\nSee the Screening questions section.\n\n### Step 4: The email and photos\n> Here's what happens next. I'm sending you an email right now with all our information, including before and after pictures. Reply to that email with photos of your nose, and I'll show them to the doctor to confirm you're suitable for the treatment, or recommend the treatment that suits you best.\n\nPhoto guide: natural light, no make-up, hair back, face relaxed. One from the front, one full side profile from each side, and one from slightly below (chin up).\n\n### Step 5: Expectations and the deposit\n> I'm going to show your photos to the doctor. Just a heads-up, we're almost fully booked, so the moment your suitability is confirmed I'll call you to secure your place. The treatment is £600 in total. To hold your place on our system, you secure it with £250, and that isn't an extra cost: it comes straight off your £600. So on the day it's just £350, and your consultation with the doctor is already paid for inside that.\n\nThree ways to frame the deposit:\n- **The head start:** \"Think of the £250 as your first payment on your new profile. You're not paying for a consultation, you're paying towards your treatment.\"\n- **The split:** \"It's £600 in two parts: £250 now to lock in your doctor's time, £350 on the day.\"\n- **The commitment:** \"The deposit is how we hold a dedicated slot with the doctor just for you. Your appointment time is reserved, and the full £250 counts towards your treatment.\"\n\nThen stop talking and wait. Never apologise for the deposit.\n\nNever name or criticise another clinic."}, {"h": "Screening questions", "body": "Only start after the pitch:\n> Now that you know how it works, I just need to ask a few quick questions so the doctor can assess you properly.\n\nOne at a time, write every answer down, never tell the patient they are or aren't suitable. After any \"yes\": \"Thank you, I'll pass that on to the doctor.\"\n\n1. Are you pregnant, trying to conceive or breastfeeding?\n2. Have you had a nose job (surgical rhinoplasty) or any nose injury or break? If so, when?\n3. Have you had filler in your nose before? Do you know which type, and when?\n4. Have you had any other filler, Botox or skin treatment on your face recently?\n5. Do you have any allergies, especially to local anaesthetic (lidocaine) or to previous fillers?\n6. Do you take blood thinners, aspirin or supplements like fish oil, or have any bleeding or clotting problems?\n7. Do you have an autoimmune condition, or any active skin problem on or around your nose?\n8. Have you had dental work, a vaccine or an illness in the last two weeks, or do you have any planned soon?\n9. Do you wear glasses every day?\n10. Timing: is there an event, photos or a holiday in the next few weeks we should plan around?"}, {"h": "Rebuttals", "body": "**Follow-through after every rebuttal:** (1) answer simply, (2) check: \"Is that the only thing, or is there anything else?\", (3) ask for the next step: \"Perfect, I'm sending that email now. Can you reply with your photos today?\"\n\n**\"I want to talk to my husband / partner.\"**\n> Sure, talking to your partner is really important. Can I know what questions they might have, so I can answer all of them?\n\n**\"I need to think about it.\"**\n> Sure. Can I know what questions you have, so I can answer them and help you in your thought process with any answers that I might have?\n\n**\"I need to check and explore my options.\"**\n> Sure. What options do you need to check or consider? If I have any information, I can help you with it.\n\n**\"I don't want to pay a deposit.\"**\n> It sounds like you want to be sure before you put money down, which makes complete sense.\n> The £250 isn't an extra charge. It's part of your £600, so you're not spending anything you wouldn't spend on the treatment anyway.\n> And you only pay it once the doctor has looked at your photos and confirmed you're suitable, so you're never paying for something that isn't right for you.\n> Does that change how it feels for you?\n\nPause after each line and let the patient answer.\n\n**\"It's too expensive.\"**\n> That's fair, it is an investment.\n> When you say it's too expensive, is that compared with something you've seen, or with what you had in mind to spend?\n> What would you need to see or hear to feel confident this treatment is worth it for you?\n> When we spoke, you told me [the bump on your bridge] really bothers you and you want it done properly. Is that still how you feel?\n> Based on everything we've discussed, what would give you the most confidence to move forward?\n\nPause after each line and let the patient answer. Never defend the price or offer a discount. If it's the budget, use the split: £250 now, £350 on the day. No finance.\n\n**\"I've seen it cheaper elsewhere.\"**\n> You probably can.\n> When you say cheaper, are you talking about the same treatment and the same result, just at a lower price?\n> What have you seen from the other clinic that gives you confidence you'll get the same result?\n> When we spoke, you told me [their concern] really bothers you and you want it done properly. Is that still how you feel?\n> Which option gives you the most confidence that you'll get the result you're looking for?\n\nPause after each line and let the patient answer. Never criticise another clinic.\n\n**\"Does it hurt?\"**\n> It sounds like comfort matters to you, and that's why a local anaesthetic may be used to help reduce discomfort. It's also quick, around 20 to 25 minutes.\n\n**\"Will people notice straight away?\"**\n> Some swelling or bruising can occur after the treatment, so if there's an event coming up, we'll plan your appointment around it. The doctor will take you through exactly what to expect for you.\n\n**\"How long does it last? Is it permanent?\"** (only when the patient asks)\n> Great question. Results typically last around 12 to 15 months, depending on the filler, and the doctor will tell you exactly what to expect for you. A lot of patients actually like that, because it's a way to refine your profile without surgery and without a lifelong commitment.\n\n**\"I'm scared it will go wrong.\"**\n> It sounds like you want to feel safe, which is exactly right. That's why the doctor reviews your photos and your answers first, before anything is booked. And many of our patients have had filler before and come to us to get it right, so the doctor is very experienced in exactly this.\n\n**\"Just send me the details and I'll get back to you.\"**\n> Of course, that's exactly what I'm doing right now. I'm sending the email with all our information and before and afters. Reply with your photos and the doctor can tell you what's right for you, so you're deciding with real information.\n\n**\"I don't live in London.\"**\n> That's no problem at all, a lot of our patients don't. We see patients from all over the UK, and people travel to us from the USA, Dubai and all over Europe. The good news is you can have your consultation and your treatment on the same day, so it's one trip. And the treatment itself takes around 20 to 25 minutes, with immediate results.\n\n**\"I've had filler before and didn't like it.\"**\n> I'm really glad you told me, and you're not alone: a lot of the patients we see have had filler elsewhere and come to us to get it looking the way they wanted. That's why the doctor looks at your photos first. Can you include a photo of how it looks now, and tell me roughly when it was done?"}, {"h": "Messages and emails", "body": "Copy, fill in the [brackets], and send.\n\n### SMS: no answer (1st attempt)\n!> Hi [Patient Name], it's [Patient Advisor Name] from DR SW Clinics. I'm following up on your enquiry about non-surgical nose reshaping. What would you most like the doctor to assess: a bump on the bridge, a hooked tip, unevenness, or your overall profile? I can then point you towards the most relevant information.\n\n### SMS: 1–2 days after sending the treatment info email\n!> Hi [Patient Name], hope you're doing well 😊 Just checking in to see if you had a chance to look over the information I sent yesterday about Non-Surgical Nose Reshaping.\n!> If any questions came up, or you'd like to talk through what you're hoping to address, just reply here. I'm happy to help, no rush at all.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### SMS: missed call\n!> Hi [Patient Name], looks like we missed each other on the phone just now. No worries at all. Is there a better time for me to call, or would you prefer to chat by text? I'm happy to help with any questions about the treatment.\n!> Best,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: request the photos\n!> Subject: Photos for your Non-Surgical Nose Reshaping assessment\n!>\n!> Hi [Patient Name],\n!> To help our doctor review your concerns and advise on the next steps, could you please reply to this email with a few recent photos of your nose?\n!> If you're comfortable, please include:\n!> - A straight-on photo\n!> - A profile photo from the left\n!> - A profile photo from the right\n!> - A slightly angled photo, if convenient\n!>\n!> Please use clear, natural lighting and avoid filters. The photos should show your full nose clearly.\n!> The doctor can use these for an initial review, but photos alone cannot confirm suitability. A consultation and medical assessment may still be needed. Please only send photos you're comfortable sharing. If you'd prefer to discuss this in a consultation instead, let me know.\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: did not dial (DND)\n!> Subject: Your Non-Surgical Nose Reshaping enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in Non-Surgical Nose Reshaping at DR SW Clinics.\n!> If you're looking to refine a bump on the bridge, uneven contours or the appearance of a hooked tip, this treatment may help create a smoother, more balanced profile without surgery. It uses hyaluronic acid dermal filler to add definition and camouflage selected contours. Because filler adds volume, it does not physically make the nose smaller; the doctor will assess whether it can address your specific concern.\n!> Treatment usually takes around 20–25 minutes. When suitable, the initial change is visible straight away, so you can see the difference before leaving the clinic. Mild swelling or bruising can occur as the result settles. Results can last up to around 12 months, depending on the filler used and individual factors.\n!> The doctor will tailor the treatment plan to your features and goals, assess your suitability, and discuss the potential risks and alternatives with you. The clinic's published price starts from £600; the exact cost will be confirmed after your assessment.\n!> The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> Reply with your main concern and a convenient time to speak, and I'll help arrange the next step.\n!> You can read more about the treatment and view before-and-after examples here:\n!> https://drswclinics.com/treatment/non-surgical-nose-re-shaping-rhinoplasty/\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics\n\n### Email: treatment info and testimonials\n!> Subject: Your Non-Surgical Nose Reshaping enquiry\n!>\n!> Dear [Patient Name],\n!> Thank you for your interest in Non-Surgical Nose Reshaping at DR SW Clinics.\n!> If you're looking to refine a bump on the bridge, uneven contours or the appearance of a hooked tip, this treatment may help create a smoother, more balanced profile without surgery. It uses hyaluronic acid dermal filler to add definition and camouflage selected contours. Because filler adds volume, it does not physically make the nose smaller; the doctor will assess whether it can address your specific concern.\n!> Treatment usually takes around 20–25 minutes. When suitable, the initial change is visible straight away, so you can see the difference before leaving the clinic. Mild swelling or bruising can occur as the result settles. Results can last up to around 12 months, depending on the filler used and individual factors.\n!> The doctor will tailor the treatment plan to your features and goals, assess your suitability, and discuss the potential risks and alternatives with you. The clinic's published price starts from £600; the exact cost will be confirmed after your assessment.\n!> The consultation deposit is £250, payable in advance, and is fully redeemable against the cost of treatment.\n!> To update your details, could you please reply with your postcode? If you'd like to arrange a consultation, just let me know and I'll be happy to help.\n!> You can read more about the treatment and view before-and-after examples here:\n!> https://drswclinics.com/treatment/non-surgical-nose-re-shaping-rhinoplasty/\n!> Kind regards,\n!> [Patient Advisor Name]\n!> Patient Advisor\n!> DR SW Clinics"}, {"h": "FAQs", "body": "**What exactly is the treatment?** \"It's a non-surgical rhinoplasty. We use hyaluronic acid dermal filler to refine the profile of your nose and, where suitable, soften the look of bumps or uneven contours.\"\n\n**Is it surgery?** \"No, it's non-surgical. No scalpel and no operating theatre.\"\n\n**Can it make my nose smaller?** \"The filler refines the profile and softens the look of bumps or uneven contours. The doctor will tell you what's possible for your nose from your photos.\"\n\n**How long does it take?** \"Around 20 to 25 minutes.\"\n\n**How long do results last?** \"The results are immediate and typically last around 12 to 15 months, depending on the filler.\"\n\n**Am I suitable?** \"That's exactly why the doctor reviews your photos first. Reply to my email with your photos and the doctor will confirm.\"\n\n**How much does it cost?** \"It's £600 in total. You secure your place with £250, which comes off the £600, so it's £350 on the day.\"\n\n**Is the deposit refundable?** \"Refund requests go through an eligibility review. Once a request is approved, the refund can take up to 28 working days to process.\" Don't raise refunds unless asked.\n\n**Can I pay monthly?** \"For this treatment it's simply £250 to secure your place and £350 on the day.\"\n\n**Can I have the consultation and treatment on the same day?** \"Yes, you can, so it's just one visit.\"\n\nStill to be confirmed: what patients typically feel, and how long swelling or bruising usually takes to settle."}, {"h": "Never say", "body": "- \"Unfortunately…\" or \"I'm afraid…\"\n- \"Consultation fee\" or \"extra charge\" for the £250. Say \"secure\", \"hold\" or \"reserve\".\n- \"Guaranteed\", \"permanent\", \"risk-free\", \"no swelling\", \"no bruising\".\n- \"It will make your nose smaller\" or any promised result.\n- Anything that diagnoses, or tells a patient they are or aren't suitable.\n- Other treatments or options before the doctor has reviewed the photos.\n- Finance or instalments for this treatment.\n- Anything negative about another clinic."}]}}], "kbimg": [{"id": "zenoti", "data": {"z3": "data:image/webp;base64,UklGRhYkAABXRUJQVlA4IAokAAAw1QCdASq8AggCPp1OoU0lpCMiIjOI+LATiWdu4XaBlfnirOMAH6hh5f4HF/zJVX+Q/ucyfU3Gnuuehn/2enp6dfRTzuf/K/dP3W/2r0mfR7/2f//9xn+sf8H//+4B/K/9L///a19Wf/Pek/6AH//4I/yf/VPx98Df7n+P/9k9Mfxf59/B/mj67+PvqI1I/kn2P/F/2j92/7r82P2n/a/4Dxh+JP9d6gXrL/Sfbt6gOyO1T/P/8b1AvXT59/rP75/fv+h5hv8z/dfUz89/vf/E9wD+Yf1//kf3z2P/5Pgw/cv9Z7A/9E/un/d/ynuv/0H/q/y35de2X9E/y3/v/0XwFfzv+0f9f/Fe3J7Mv3e9nH9sf/+HnBEAcTSmt0NBrfH9a7/S5HUq/x+lyOpV/j9LkdSr/H56++3Q6X6JDvlAPl12I+R5py0Xmu9/rTHYMbcfGEl7jGzpXK7LFips+EEygILA4ocDFsHDYIYR6orx28ridvK2hBkZW+gqDlVXHwwDBTI56ebDgwZIfaEX2ZVQu9GT5RvSKwjabcYMi+bIAbJJZQuzIL4PW6r9W8n+AuHwYgyMCCan1n0XA7v8Yb5TAToVsvpD0y6p41IAB7wPBj8esE1i1+TU9CXFvRtCRgZr3ETa/88xeX+ZAoBmqrYLAl2npS8NlRXR8kaBlzbGoKZzk9onMGkiMRWU0g7yhyFk1mS3BKucTtnS7CW2bBHS12wouSziwxwqEXvTjPXa3gM3yzeEFz1j9LkdSr6Sdd8BWE0DYgHNCbM2wH2A+wH2A+wH2A+wH2A+wH2A+wH2A+wH2A+wH2A+wYsEPmYSX2Tu9PHgaJa58ReCRZZTYDbkiWQ7W08sOolcfQmkPGa2PB5i+aeFGDerFwhyQLJIqlkZP9hnVR2eriN7bDkr7FwEtgHEIerH/mcqERCZVTG3HvjEdZ4zzNfz4sC7Xd3iKM6mGBGK4WL4iqbQCGBAazaucTt5XE7cKaggEk0WZiAYXvTIC3PAbTGn8VCEc4MDCeqeRiRT0iRI5yCl8x6B8BUd2o1Waz6nUoFej7hE4ARcSNXfEJ4x0CnIjCNTxTt5XE7eVxNcSOJEPbYFYY8OE0IxJzyOuFOIdFK00FGTU8NBtlV/j9LkdSrjBJYN7bC0IxWcKTo9GLA4vi+pLO0wT1vr4xUzt7zFZuaYv4VaymeHF/XEssARJyimcTWZbycj3zpex <script>
(function(){
const $=s=>document.querySelector(s);
const S={docs:[],loaded:false,canEdit:false,db:null,user:null,myId:null,cur:null,q:'',editing:null,confirmDel:false,names:{},err:null,imgs:{}};
const TAB=Math.random().toString(36).slice(2);
const TEMPLATE=['Overview','Who it is for','Pricing','What happens on the day','Recovery & aftercare','Common questions & objections','How to pitch it'];

let ADVISOR='';
function personalize(s){return ADVISOR?s.replace(/\[(?:Patient Advisor Name|your name)\]/gi,ADVISOR):s}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>').replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function imgsrc(s){s=String(s||'').trim();if(s.startsWith('img:'))s=S.imgs[s.slice(4)]||'';return /^(data:image\/|https:\/\/)/.test(s)?s:''}
function md(src){
  const lines=personalize(String(src||'')).replace(/\r/g,'').split('\n');let out='',list=null,para=[],quote=[],tm=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}};
  const flushL=()=>{if(list){out+='</'+list+'>';list=null}};
  const flushT=()=>{if(tm.length){const t=tm.join('\n');out+='<div class="script tmpl"><div class="lab"><span>Ready to send</span><button type="button" data-copy="'+esc(t)+'">Copy</button></div><div class="body">'+esc(t)+'</div></div>';tm=[]}};
  const flushQ=()=>{if(quote.length){out+='<div class="script"><div class="lab"><span>Say it like this</span><button type="button" data-copy="'+esc(quote.join('\n'))+'">Copy</button></div>'+quote.map(l=>'<p>'+inline(l)+'</p>').join('')+'</div>';quote=[]}};
  for(const raw of lines){const l=raw.trimEnd();
    {const im=l.match(/^!\[(.*?)\]\((.+?)\)\s*$/);if(im){flushP();flushL();flushQ();flushT();const u=imgsrc(im[2]);out+=u?'<figure class="shot"><img src="'+esc(u)+'" alt="'+esc(im[1])+'" loading="lazy">'+(im[1]?'<figcaption>'+esc(im[1])+'</figcaption>':'')+'</figure>':'';continue}}
    if(/^!>\s?/.test(l)){flushP();flushL();flushQ();tm.push(raw.replace(/^!>\s?/,''));continue}else flushT();
    if(/^>\s?/.test(l)){flushP();flushL();quote.push(l.replace(/^>\s?/,''));continue}else flushQ();
    let m;
    if(m=l.match(/^\s*[-•]\s+(.*)/)){flushP();if(list!=='ul'){flushL();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flushP();if(list!=='ol'){flushL();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>';continue}
    if(m=l.match(/^#{1,3}\s+(.*)/)){flushP();flushL();out+='<h3>'+inline(m[1])+'</h3>';continue}
    if(!l.trim()){flushP();flushL();continue}
    flushL();para.push(l.trim());
  }
  flushP();flushL();flushQ();flushT();return out;
}
function plain(s){return String(s||'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/[*>#]/g,'').replace(/\s+/g,' ').trim()}
function slug(t){return (t||'page').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'page'}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
function fmtDate(ms){if(!ms)return'';try{return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch(e){return''}}

function sorted(kind){return S.docs.filter(d=>d.kind===kind).sort((a,b)=>(a.order??999)-(b.order??999)||String(a.title).localeCompare(String(b.title)))}
function hashOf(d){return 't-'+d.id}
function findByHash(h){return S.docs.find(d=>hashOf(d)===h)}

function setRole(){
  const r=$('#role');
  if(!S.loaded&&!S.err){return}
  r.className='role'+(S.canEdit?' mgr':'');
  r.querySelector('span').textContent=(ADVISOR?ADVISOR+' · ':'')+(S.canEdit?'Manager · editing on':'View only');
  $('#addT').hidden=!S.canEdit;
}

function renderNav(){
  const item=d=>'<li><button type="button" data-go="'+esc(hashOf(d))+'"'+(S.cur===hashOf(d)&&!S.q?' aria-current="page"':'')+'>'+esc(d.title||'Untitled')+'</button></li>';
  const p=sorted('process'),t=sorted('treatment');
  $('#navProcess').innerHTML=p.length?p.map(item).join(''):'<li class="empty">'+(S.loaded?'Nothing here yet':'…')+'</li>';
  $('#navTreat').innerHTML=t.length?t.map(item).join(''):'<li class="empty">'+(S.loaded?'No treatments yet':'…')+'</li>';
}

async function names(ids){
  ids=[...new Set(ids.filter(Boolean))];if(!S.user||!ids.length)return;
  try{const ps=await S.user.profiles(ids);let changed=false;for(const id of ids){const n=ps[id]?.name||'';if(S.names[id]!==n){S.names[id]=n;changed=true}}if(changed&&!S.editing)renderMain()}catch(e){}
}

function renderMain(){
  const m=$('#main');
  if(S.editing){return}
  if(S.err){m.innerHTML='<div class="state"><h2>The handbook could not load</h2><p>'+esc(S.err)+'</p></div>';return}
  if(!S.loaded){return}
  if(S.q){renderSearch();return}
  const d=findByHash(S.cur)||sorted('process')[0]||sorted('treatment')[0];
  if(!d){
    m.innerHTML='<div class="state"><h2>The handbook is empty</h2><p>'+(S.canEdit?'Add the first treatment with “+ Add” in the left menu.':'Clinic management has not published any content yet. Please check back soon.')+'</p></div>';return}
  S.cur=hashOf(d);
  const secs=Array.isArray(d.sections)?d.sections:[];
  const who=d.updatedBy?(S.names[d.updatedBy]||''):'';
  if(d.updatedBy&&!(d.updatedBy in S.names))names([d.updatedBy]);
  let h='<div class="head"><div><div class="eyebrow">'+(d.kind==='process'?'Clinic process':'Treatment')+'</div><h1 class="title">'+esc(d.title||'Untitled')+'</h1>';
  h+='<div class="meta">'+(d.updatedAt?'<span>Updated '+esc(fmtDate(d.updatedAt))+(who?' by '+esc(who):'')+'</span>':'')+'<span>'+secs.length+' section'+(secs.length===1?'':'s')+'</span></div></div>';
  if(S.canEdit){h+='<div class="actions"><button class="btn primary" type="button" data-act="edit">Edit page</button>'+(d.kind==='treatment'?'<button class="btn danger ghost" type="button" data-act="askdel">Delete</button>':'')+'</div>'}
  h+='</div>';
  if(S.confirmDel){h+='<div class="confirm"><span>Delete “'+esc(d.title)+'” for everyone? This cannot be undone.</span><button class="btn danger" type="button" data-act="del">Delete page</button><button class="btn ghost" type="button" data-act="nodel">Keep it</button></div>'}
  if(secs.length>2)h+='<nav class="toc" aria-label="Sections">'+secs.map((s,i)=>'<button type="button" data-jump="'+i+'">'+esc(s.h||'Section '+(i+1))+'</button>').join('')+'</nav>';
  h+=secs.map((s,i)=>'<section class="sec" id="sec-'+i+'"><h2>'+esc(s.h||'')+'</h2>'+(String(s.body||'').trim()?'<div class="prose">'+md(s.body)+'</div>':'<div class="pending">Awaiting content from clinic management.</div>')+'</section>').join('');
  if(!secs.length)h+='<div class="state"><p>This page has no sections yet.</p></div>';
  m.innerHTML=h;
}

function renderSearch(){
  const q=S.q.toLowerCase(),hits=[];
  for(const d of S.docs){
    if(String(d.title||'').toLowerCase().includes(q))hits.push({d,i:-1,snip:''});
    (d.sections||[]).forEach((s,i)=>{const hay=(s.h||'')+' '+plain(s.body);const at=hay.toLowerCase().indexOf(q);if(at>=0){const st=Math.max(0,at-60);hits.push({d,i,h:s.h,snip:(st?'…':'')+hay.slice(st,at+q.length+90)+'…'})}});
  }
  const hl=t=>{const e=esc(t);const qq=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp(qq,'gi'),x=>'<mark>'+x+'</mark>')};
  $('#main').innerHTML='<div class="head"><div><div class="eyebrow">Search</div><h1 class="title">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(S.q)+'”</h1></div></div>'+
   (hits.length?'<div class="results">'+hits.slice(0,60).map(x=>'<button class="hit" type="button" data-go="'+esc(hashOf(x.d))+'" data-sec="'+x.i+'"><div class="t">'+hl(x.d.title||'Untitled')+(x.h?' <span>· '+hl(x.h)+'</span>':'')+'</div>'+(x.snip?'<div class="s">'+hl(x.snip)+'</div>':'')+'</button>').join('')+'</div>':'<div class="state"><p>Nothing matches. Try a treatment name, “deposit”, “finance” or “£250”.</p></div>');
}

function render(){setRole();renderNav();renderMain()}

function go(h,sec){
  S.q='';$('#q').value='';S.cur=h;S.confirmDel=false;
  try{history.replaceState(null,'','#'+h)}catch(e){}
  $('#rail').classList.remove('open');
  render();
  if(sec!=null&&sec>=0){const el=document.getElementById('sec-'+sec);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}else window.scrollTo({top:0});
}

/* ---------- editor ---------- */
let leaseTimer=null;
function stopLease(){clearInterval(leaseTimer);leaseTimer=null}
async function startEdit(d,isNew){
  if(!isNew&&S.db){
    try{const r=await S.db.doc('kb/'+d.id).acquire({holder:TAB,ttlMs:120000});
      if(r&&r.acquired===false){toast('Another manager is editing this page right now. Try again in a couple of minutes.');return}
      leaseTimer=setInterval(()=>{S.db.doc('kb/'+d.id).acquire({holder:TAB,ttlMs:120000}).catch(()=>{})},60000);
    }catch(e){}
  }
  S.editing={id:d.id,isNew,kind:d.kind,order:d.order,title:d.title||'',sections:(d.sections||[]).map(s=>({h:s.h||'',body:s.body||''}))};
  drawEditor();
}
function readEditor(){
  const e=S.editing;e.title=$('#ed-title').value;
  e.sections=[...document.querySelectorAll('.edsec')].map(el=>({h:el.querySelector('input').value,body:el.querySelector('textarea').value}));
}
const ICON={up:'<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'};
function drawEditor(){
  const e=S.editing;
  let h='<div class="head"><div><div class="eyebrow">'+(e.isNew?'New treatment':'Editing')+'</div><h1 class="title">'+esc(e.title||'Untitled')+'</h1></div></div><div class="ed">';
  h+='<div class="field"><label for="ed-title">Page title</label><input id="ed-title" value="'+esc(e.title)+'" placeholder="e.g. Rhinoplasty"></div>';
  h+='<div class="hint">Formatting: start a line with <code>- </code> for bullets, <code>1. </code> for steps, <code>**bold**</code> for emphasis, <code>### </code> for a small heading, <code>&gt; </code> for a word-for-word script agents can copy, and <code>!&gt; </code> at the start of every line of an SMS or email template (shown exactly as written, with a Copy button). Leave a section empty and agents will see “Awaiting content”.</div>';
  e.sections.forEach((s,i)=>{
    h+='<div class="edsec"><div class="row"><input id="ed-h-'+i+'" value="'+esc(s.h)+'" placeholder="Section heading" aria-label="Section heading">'+
    '<button class="ic" type="button" data-mv="'+i+':-1" title="Move up" aria-label="Move section up"'+(i===0?' disabled':'')+'>'+ICON.up+'</button>'+
    '<button class="ic" type="button" data-mv="'+i+':1" title="Move down" aria-label="Move section down"'+(i===e.sections.length-1?' disabled':'')+'>'+ICON.down+'</button>'+
    '<button class="ic" type="button" data-rm="'+i+'" title="Remove section" aria-label="Remove section">'+ICON.x+'</button></div>'+
    '<textarea id="ed-b-'+i+'" aria-label="Section content" placeholder="Write the content agents should read…">'+esc(s.body)+'</textarea></div>';
  });
  h+='<div><button class="btn" type="button" data-act="addsec">+ Add section</button></div>';
  h+='<div class="bar"><button class="btn primary" type="button" data-act="save">'+(e.isNew?'Publish page':'Save changes')+'</button><button class="btn ghost" type="button" data-act="cancel">Cancel</button><span class="msg" id="edmsg"></span></div></div>';
  $('#main').innerHTML=h;
}
async function save(){
  readEditor();const e=S.editing,msg=$('#edmsg');
  if(!e.title.trim()){msg.className='msg err';msg.textContent='Add a page title before saving.';return}
  const body={kind:e.kind,title:e.title.trim(),order:e.order??999,sections:e.sections.filter(s=>s.h.trim()||s.body.trim()).map(s=>({h:s.h.trim(),body:s.body})),updatedAt:Date.now(),updatedBy:S.myId||null};
  msg.className='msg';msg.textContent='Saving…';
  try{await S.db.doc('kb/'+e.id).set(body);stopLease();const id=e.id;S.editing=null;toast(e.isNew?'Page published':'Changes saved — agents see them now');go('t-'+id)}
  catch(err){msg.className='msg err';msg.textContent=(err&&err.code==='invalid_argument')?'You do not have edit access. Ask the owner to add you as an Editor.':'Could not save. Check your connection and try again.'}
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.copy!=null){const txt=t.dataset.copy;try{await navigator.clipboard.writeText(txt);toast('Script copied')}catch(e){const r=document.createRange();r.selectNodeContents(t.closest('.script'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected — press Ctrl+C')}return}
  if(t.dataset.go){if(S.editing){toast('Save or cancel your edits first');return}go(t.dataset.go,t.dataset.sec!=null?+t.dataset.sec:null);return}
  if(t.dataset.jump){const el=document.getElementById('sec-'+t.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.id==='mobnav'){$('#rail').classList.toggle('open');return}
  if(t.id==='addT'){if(S.editing){toast('Save or cancel your edits first');return}const id=slug('treatment')+'-'+Date.now().toString(36);startEdit({id,kind:'treatment',title:'',sections:TEMPLATE.map(h=>({h,body:''}))},true);$('#rail').classList.remove('open');return}
  if(t.dataset.mv){readEditor();const[i,dir]=t.dataset.mv.split(':').map(Number);const a=S.editing.sections,j=i+dir;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];drawEditor()}return}
  if(t.dataset.rm){readEditor();S.editing.sections.splice(+t.dataset.rm,1);drawEditor();return}
  const act=t.dataset.act;if(!act)return;
  const d=findByHash(S.cur);
  if(act==='edit'&&d)startEdit(d,false);
  else if(act==='addsec'){readEditor();S.editing.sections.push({h:'',body:''});drawEditor();const ins=document.querySelectorAll('.edsec input');ins[ins.length-1]?.focus()}
  else if(act==='save')save();
  else if(act==='cancel'){stopLease();S.editing=null;render();window.scrollTo({top:0})}
  else if(act==='askdel'){S.confirmDel=true;renderMain()}
  else if(act==='nodel'){S.confirmDel=false;renderMain()}
  else if(act==='del'&&d){try{await S.db.doc('kb/'+d.id).delete();S.confirmDel=false;S.cur=null;toast('Page deleted');render()}catch(e){toast('Could not delete. Try again.')}}
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{if(S.editing)return;S.q=e.target.value.trim();renderNav();renderMain()},120)});
document.addEventListener('input',e=>{if(e.target.id==='ed-title'&&S.editing){$('#main .title').textContent=e.target.value||'Untitled'}});

S.cur=(location.hash||'').slice(1)||null;

(async function init(){
  const use=window.claude&&window.claude.use;
  if(!use){S.err='Open this page from its claude.ai link to see the clinic content.';render();return}
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  S.db=db;S.user=user;
  if(user){try{S.canEdit=await user.canEdit();S.myId=await user.id()}catch(e){}}
  if(window.__ADVISOR)ADVISOR=window.__ADVISOR;
  else if(user){try{const me=await user.me();if(me&&me.name)ADVISOR=me.name.trim().split(/\s+/)[0]}catch(e){}}
  if(!db){S.err='Sign in to claude.ai with the account this handbook was shared with, then reopen the link.';render();return}
  db.collection('kbimg').onSnapshot(s=>{const m={};s.docs.forEach(d=>Object.assign(m,d.data()||{}));S.imgs=m;if(S.loaded)render()},()=>{});
  db.collection('kb').onSnapshot(snap=>{
    S.docs=snap.docs.map(x=>Object.assign({id:x.id},x.data()));S.loaded=true;
    if(S.cur&&!findByHash(S.cur)&&S.docs.length&&!S.editing)S.cur=null;
    render();
  },err=>{S.err=err&&err.code==='revoked'?'Your access to this handbook has changed.':'The connection to the handbook dropped. Reload the page to reconnect.';render()});
})();
})();
</script>
