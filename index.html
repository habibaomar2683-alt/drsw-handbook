<header class="band"><div class="band-in">
  <div class="mark">Dr.SW<small>Clinics</small></div>
  <div class="band-title">Agent Knowledge Base</div>
  <div class="band-sp"></div>
  <span class="role" id="role"><i></i><span>Connecting…</span></span>
</div></header>

<div class="wrap">
  <aside class="rail" id="rail">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search treatments, pricing, scripts…" autocomplete="off" aria-label="Search the knowledge base">
    </div>
    <button class="btn mobnav" id="mobnav" type="button">Browse topics</button>
    <div class="grp"><h4>Clinic</h4><ul class="nav" id="navProcess"></ul></div>
    <div class="grp"><h4><span>Treatments</span><button class="addbtn" id="addT" type="button" hidden>+ Add</button></h4><ul class="nav" id="navTreat"></ul></div>
    <div class="railnote" id="railnote">Content is set by clinic management. If something is missing or unclear, check with your manager before telling a patient.</div>
  </aside>
  <main id="main">
    <div class="state"><h2>Loading the handbook…</h2><p>Fetching the latest clinic information.</p></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const S={docs:[],loaded:false,canEdit:false,db:null,user:null,myId:null,cur:null,q:'',editing:null,confirmDel:false,names:{},err:null,imgs:{}};
const TAB=Math.random().toString(36).slice(2);
const TEMPLATE=['Overview','Who it is for','Pricing','What happens on the day','Recovery & aftercare','Common questions & objections','How to pitch it'];

let ADVISOR='';
function personalize(s){return ADVISOR?s.replace(/\[(?:Patient Advisor Name|your name)\]/gi,ADVISOR):s}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>').replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function imgsrc(s){s=String(s||'').trim();if(s.startsWith('img:'))s=S.imgs[s.slice(4)]||'';return /^(data:image\/|https:\/\/)/.test(s)?s:''}
function md(src){
  const lines=personalize(String(src||'')).replace(/\r/g,'').split('\n');let out='',list=null,para=[],quote=[],tm=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}};
  const flushL=()=>{if(list){out+='</'+list+'>';list=null}};
  const flushT=()=>{if(tm.length){const t=tm.join('\n');out+='<div class="script tmpl"><div class="lab"><span>Ready to send</span><button type="button" data-copy="'+esc(t)+'">Copy</button></div><div class="body">'+esc(t)+'</div></div>';tm=[]}};
  const flushQ=()=>{if(quote.length){out+='<div class="script"><div class="lab"><span>Say it like this</span><button type="button" data-copy="'+esc(quote.join('\n'))+'">Copy</button></div>'+quote.map(l=>'<p>'+inline(l)+'</p>').join('')+'</div>';quote=[]}};
  let tb=[];const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const cell=c=>inline(c).replace(/&lt;br\s*\/?&gt;/gi,'<br>');
  const flushTb=()=>{if(!tb.length)return;const rows=tb.map(cells).filter(r=>!r.every(c=>/^:?-{2,}:?$/.test(c)));tb=[];if(!rows.length)return;const hd=rows.shift();out+='<div class="tbl"><table><thead><tr>'+hd.map(c=>'<th scope="col">'+cell(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+hd.map((_,i)=>'<td>'+cell(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^\s*\|/.test(l)){if(!tb.length){flushP();flushL();flushQ();flushT()}tb.push(l);continue}else flushTb();
    {const im=l.match(/^!\[(.*?)\]\((.+?)\)\s*$/);if(im){flushP();flushL();flushQ();flushT();const u=imgsrc(im[2]);out+=u?'<figure class="shot"><img src="'+esc(u)+'" alt="'+esc(im[1])+'" loading="lazy">'+(im[1]?'<figcaption>'+esc(im[1])+'</figcaption>':'')+'</figure>':'';continue}}
    if(/^!>\s?/.test(l)){flushP();flushL();flushQ();tm.push(raw.replace(/^!>\s?/,''));continue}else flushT();
    if(/^>\s?/.test(l)){flushP();flushL();quote.push(l.replace(/^>\s?/,''));continue}else flushQ();
    let m;
    if(m=l.match(/^\s*[-•]\s+(.*)/)){flushP();if(list!=='ul'){flushL();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flushP();if(list!=='ol'){flushL();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>';continue}
    if(m=l.match(/^#{1,3}\s+(.*)/)){flushP();flushL();out+='<h3>'+inline(m[1])+'</h3>';continue}
    if(!l.trim()){flushP();flushL();continue}
    flushL();para.push(l.trim());
  }
  flushP();flushL();flushQ();flushT();flushTb();return out;
}
function plain(s){return String(s||'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/<br\s*\/?>/gi,' ').replace(/\|\s*:?-{2,}:?\s*/g,' ').replace(/[*>#|]/g,' ').replace(/\s+/g,' ').trim()}
function slug(t){return (t||'page').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'page'}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
function fmtDate(ms){if(!ms)return'';try{return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch(e){return''}}

function sorted(kind){return S.docs.filter(d=>d.kind===kind).sort((a,b)=>(a.order??999)-(b.order??999)||String(a.title).localeCompare(String(b.title)))}
function hashOf(d){return 't-'+d.id}
function findByHash(h){return S.docs.find(d=>hashOf(d)===h)}

function setRole(){
  const r=$('#role');
  if(!S.loaded&&!S.err){return}
  r.className='role'+(S.canEdit?' mgr':'');
  r.querySelector('span').textContent=(ADVISOR?ADVISOR+' · ':'')+(S.canEdit?'Manager · editing on':'View only');
  $('#addT').hidden=!S.canEdit;
}

function renderNav(){
  const item=d=>'<li><button type="button" data-go="'+esc(hashOf(d))+'"'+(S.cur===hashOf(d)&&!S.q?' aria-current="page"':'')+'>'+esc(d.title||'Untitled')+'</button></li>';
  const p=sorted('process'),t=sorted('treatment');
  $('#navProcess').innerHTML=p.length?p.map(item).join(''):'<li class="empty">'+(S.loaded?'Nothing here yet':'…')+'</li>';
  $('#navTreat').innerHTML=t.length?t.map(item).join(''):'<li class="empty">'+(S.loaded?'No treatments yet':'…')+'</li>';
}

async function names(ids){
  ids=[...new Set(ids.filter(Boolean))];if(!S.user||!ids.length)return;
  try{const ps=await S.user.profiles(ids);let changed=false;for(const id of ids){const n=ps[id]?.name||'';if(S.names[id]!==n){S.names[id]=n;changed=true}}if(changed&&!S.editing)renderMain()}catch(e){}
}

function renderMain(){
  const m=$('#main');
  if(S.editing){return}
  if(S.err){m.innerHTML='<div class="state"><h2>The handbook could not load</h2><p>'+esc(S.err)+'</p></div>';return}
  if(!S.loaded){return}
  if(S.q){renderSearch();return}
  const d=findByHash(S.cur)||sorted('process')[0]||sorted('treatment')[0];
  if(!d){
    m.innerHTML='<div class="state"><h2>The handbook is empty</h2><p>'+(S.canEdit?'Add the first treatment with “+ Add” in the left menu.':'Clinic management has not published any content yet. Please check back soon.')+'</p></div>';return}
  S.cur=hashOf(d);
  const secs=Array.isArray(d.sections)?d.sections:[];
  const who=d.updatedBy?(S.names[d.updatedBy]||''):'';
  if(d.updatedBy&&!(d.updatedBy in S.names))names([d.updatedBy]);
  let h='<div class="head"><div><div class="eyebrow">'+(d.kind==='process'?'Clinic process':'Treatment')+'</div><h1 class="title">'+esc(d.title||'Untitled')+'</h1>';
  h+='<div class="meta">'+(d.updatedAt?'<span>Updated '+esc(fmtDate(d.updatedAt))+(who?' by '+esc(who):'')+'</span>':'')+'<span>'+secs.length+' section'+(secs.length===1?'':'s')+'</span></div></div>';
  if(S.canEdit){h+='<div class="actions"><button class="btn primary" type="button" data-act="edit">Edit page</button>'+(d.kind==='treatment'?'<button class="btn danger ghost" type="button" data-act="askdel">Delete</button>':'')+'</div>'}
  h+='</div>';
  if(S.confirmDel){h+='<div class="confirm"><span>Delete “'+esc(d.title)+'” for everyone? This cannot be undone.</span><button class="btn danger" type="button" data-act="del">Delete page</button><button class="btn ghost" type="button" data-act="nodel">Keep it</button></div>'}
  if(secs.length>2)h+='<nav class="toc" aria-label="Sections">'+secs.map((s,i)=>'<button type="button" data-jump="'+i+'">'+esc(s.h||'Section '+(i+1))+'</button>').join('')+'</nav>';
  h+=secs.map((s,i)=>'<section class="sec" id="sec-'+i+'"><h2>'+esc(s.h||'')+'</h2>'+(String(s.body||'').trim()?'<div class="prose">'+md(s.body)+'</div>':'<div class="pending">Awaiting content from clinic management.</div>')+'</section>').join('');
  if(!secs.length)h+='<div class="state"><p>This page has no sections yet.</p></div>';
  m.innerHTML=h;
}

function renderSearch(){
  const q=S.q.toLowerCase(),hits=[];
  for(const d of S.docs){
    if(String(d.title||'').toLowerCase().includes(q))hits.push({d,i:-1,snip:''});
    (d.sections||[]).forEach((s,i)=>{const hay=(s.h||'')+' '+plain(s.body);const at=hay.toLowerCase().indexOf(q);if(at>=0){const st=Math.max(0,at-60);hits.push({d,i,h:s.h,snip:(st?'…':'')+hay.slice(st,at+q.length+90)+'…'})}});
  }
  const hl=t=>{const e=esc(t);const qq=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp(qq,'gi'),x=>'<mark>'+x+'</mark>')};
  $('#main').innerHTML='<div class="head"><div><div class="eyebrow">Search</div><h1 class="title">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(S.q)+'”</h1></div></div>'+
   (hits.length?'<div class="results">'+hits.slice(0,60).map(x=>'<button class="hit" type="button" data-go="'+esc(hashOf(x.d))+'" data-sec="'+x.i+'"><div class="t">'+hl(x.d.title||'Untitled')+(x.h?' <span>· '+hl(x.h)+'</span>':'')+'</div>'+(x.snip?'<div class="s">'+hl(x.snip)+'</div>':'')+'</button>').join('')+'</div>':'<div class="state"><p>Nothing matches. Try a treatment name, “deposit”, “finance” or “£250”.</p></div>');
}

function render(){setRole();renderNav();renderMain()}

function go(h,sec){
  S.q='';$('#q').value='';S.cur=h;S.confirmDel=false;
  try{history.replaceState(null,'','#'+h)}catch(e){}
  $('#rail').classList.remove('open');
  render();
  if(sec!=null&&sec>=0){const el=document.getElementById('sec-'+sec);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}else window.scrollTo({top:0});
}

/* ---------- editor ---------- */
let leaseTimer=null;
function stopLease(){clearInterval(leaseTimer);leaseTimer=null}
async function startEdit(d,isNew){
  if(!isNew&&S.db){
    try{const r=await S.db.doc('kb/'+d.id).acquire({holder:TAB,ttlMs:120000});
      if(r&&r.acquired===false){toast('Another manager is editing this page right now. Try again in a couple of minutes.');return}
      leaseTimer=setInterval(()=>{S.db.doc('kb/'+d.id).acquire({holder:TAB,ttlMs:120000}).catch(()=>{})},60000);
    }catch(e){}
  }
  S.editing={id:d.id,isNew,kind:d.kind,order:d.order,title:d.title||'',sections:(d.sections||[]).map(s=>({h:s.h||'',body:s.body||''}))};
  drawEditor();
}
function readEditor(){
  const e=S.editing;e.title=$('#ed-title').value;
  e.sections=[...document.querySelectorAll('.edsec')].map(el=>({h:el.querySelector('input').value,body:el.querySelector('textarea').value}));
}
const ICON={up:'<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'};
function drawEditor(){
  const e=S.editing;
  let h='<div class="head"><div><div class="eyebrow">'+(e.isNew?'New treatment':'Editing')+'</div><h1 class="title">'+esc(e.title||'Untitled')+'</h1></div></div><div class="ed">';
  h+='<div class="field"><label for="ed-title">Page title</label><input id="ed-title" value="'+esc(e.title)+'" placeholder="e.g. Rhinoplasty"></div>';
  h+='<div class="hint">Formatting: start a line with <code>- </code> for bullets, <code>1. </code> for steps, <code>**bold**</code> for emphasis, <code>### </code> for a small heading, <code>&gt; </code> for a word-for-word script agents can copy, and <code>!&gt; </code> at the start of every line of an SMS or email template (shown exactly as written, with a Copy button). For a table, write rows like <code>| Treatment | Price |</code> (first row is the header); use <code>&lt;br&gt;</code> for a new line inside a cell. Leave a section empty and agents will see “Awaiting content”.</div>';
  e.sections.forEach((s,i)=>{
    h+='<div class="edsec"><div class="row"><input id="ed-h-'+i+'" value="'+esc(s.h)+'" placeholder="Section heading" aria-label="Section heading">'+
    '<button class="ic" type="button" data-mv="'+i+':-1" title="Move up" aria-label="Move section up"'+(i===0?' disabled':'')+'>'+ICON.up+'</button>'+
    '<button class="ic" type="button" data-mv="'+i+':1" title="Move down" aria-label="Move section down"'+(i===e.sections.length-1?' disabled':'')+'>'+ICON.down+'</button>'+
    '<button class="ic" type="button" data-rm="'+i+'" title="Remove section" aria-label="Remove section">'+ICON.x+'</button></div>'+
    '<textarea id="ed-b-'+i+'" aria-label="Section content" placeholder="Write the content agents should read…">'+esc(s.body)+'</textarea></div>';
  });
  h+='<div><button class="btn" type="button" data-act="addsec">+ Add section</button></div>';
  h+='<div class="bar"><button class="btn primary" type="button" data-act="save">'+(e.isNew?'Publish page':'Save changes')+'</button><button class="btn ghost" type="button" data-act="cancel">Cancel</button><span class="msg" id="edmsg"></span></div></div>';
  $('#main').innerHTML=h;
}
async function save(){
  readEditor();const e=S.editing,msg=$('#edmsg');
  if(!e.title.trim()){msg.className='msg err';msg.textContent='Add a page title before saving.';return}
  const body={kind:e.kind,title:e.title.trim(),order:e.order??999,sections:e.sections.filter(s=>s.h.trim()||s.body.trim()).map(s=>({h:s.h.trim(),body:s.body})),updatedAt:Date.now(),updatedBy:S.myId||null};
  msg.className='msg';msg.textContent='Saving…';
  try{await S.db.doc('kb/'+e.id).set(body);stopLease();const id=e.id;S.editing=null;toast(e.isNew?'Page published':'Changes saved — agents see them now');go('t-'+id)}
  catch(err){msg.className='msg err';msg.textContent=(err&&err.code==='invalid_argument')?'You do not have edit access. Ask the owner to add you as an Editor.':'Could not save. Check your connection and try again.'}
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.copy!=null){const txt=t.dataset.copy;try{await navigator.clipboard.writeText(txt);toast('Script copied')}catch(e){const r=document.createRange();r.selectNodeContents(t.closest('.script'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected — press Ctrl+C')}return}
  if(t.dataset.go){if(S.editing){toast('Save or cancel your edits first');return}go(t.dataset.go,t.dataset.sec!=null?+t.dataset.sec:null);return}
  if(t.dataset.jump){const el=document.getElementById('sec-'+t.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.id==='mobnav'){$('#rail').classList.toggle('open');return}
  if(t.id==='addT'){if(S.editing){toast('Save or cancel your edits first');return}const id=slug('treatment')+'-'+Date.now().toString(36);startEdit({id,kind:'treatment',title:'',sections:TEMPLATE.map(h=>({h,body:''}))},true);$('#rail').classList.remove('open');return}
  if(t.dataset.mv){readEditor();const[i,dir]=t.dataset.mv.split(':').map(Number);const a=S.editing.sections,j=i+dir;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];drawEditor()}return}
  if(t.dataset.rm){readEditor();S.editing.sections.splice(+t.dataset.rm,1);drawEditor();return}
  const act=t.dataset.act;if(!act)return;
  const d=findByHash(S.cur);
  if(act==='edit'&&d)startEdit(d,false);
  else if(act==='addsec'){readEditor();S.editing.sections.push({h:'',body:''});drawEditor();const ins=document.querySelectorAll('.edsec input');ins[ins.length-1]?.focus()}
  else if(act==='save')save();
  else if(act==='cancel'){stopLease();S.editing=null;render();window.scrollTo({top:0})}
  else if(act==='askdel'){S.confirmDel=true;renderMain()}
  else if(act==='nodel'){S.confirmDel=false;renderMain()}
  else if(act==='del'&&d){try{await S.db.doc('kb/'+d.id).delete();S.confirmDel=false;S.cur=null;toast('Page deleted');render()}catch(e){toast('Could not delete. Try again.')}}
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{if(S.editing)return;S.q=e.target.value.trim();renderNav();renderMain()},120)});
document.addEventListener('input',e=>{if(e.target.id==='ed-title'&&S.editing){$('#main .title').textContent=e.target.value||'Untitled'}});

S.cur=(location.hash||'').slice(1)||null;

(async function init(){
  const use=window.claude&&window.claude.use;
  if(!use){S.err='Open this page from its claude.ai link to see the clinic content.';render();return}
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  S.db=db;S.user=user;
  if(user){try{S.canEdit=await user.canEdit();S.myId=await user.id()}catch(e){}}
  if(window.__ADVISOR)ADVISOR=window.__ADVISOR;
  else if(user){try{const me=await user.me();if(me&&me.name)ADVISOR=me.name.trim().split(/\s+/)[0]}catch(e){}}
  if(!db){S.err='Sign in to claude.ai with the account this handbook was shared with, then reopen the link.';render();return}
  db.collection('kbimg').onSnapshot(s=>{const m={};s.docs.forEach(d=>Object.assign(m,d.data()||{}));S.imgs=m;if(S.loaded)render()},()=>{});
  db.collection('kb').onSnapshot(snap=>{
    S.docs=snap.docs.map(x=>Object.assign({id:x.id},x.data()));S.loaded=true;
    if(S.cur&&!findByHash(S.cur)&&S.docs.length&&!S.editing)S.cur=null;
    render();
  },err=>{S.err=err&&err.code==='revoked'?'Your access to this handbook has changed.':'The connection to the handbook dropped. Reload the page to reconnect.';render()});
})();
})();
</script>
